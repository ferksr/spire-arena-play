<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Spire Arena</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%23F2F4F9%22/%3E%3Cg transform=%22translate%283.6 3.6%29 scale%28.7%29%22 fill=%22none%22 stroke=%22%23262A37%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M12 2.5l3 3.5h4v4.5l2 2.5V20H3v-7l2-2.5V6h4z%22/%3E%3Cpath d=%22M10 20v-4a2 2 0 0 1 4 0v4%22/%3E%3C/g%3E%3C/svg%3E">
<meta property="og:type" content="website">
<meta property="og:title" content="Spire Arena">
<meta property="og:description" content="Juego de cartas y tablero contra la IA.">
<meta property="og:image" content="https://ferksr.github.io/spire-arena-play/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  color-scheme:light;
  --bg:#F3F4F8;--surface:#fff;--surface-2:#F8F9FC;--line:#E7E9F0;--line-2:#D9DCE6;
  --ink:#262A37;--ink-2:#5A6074;--ink-3:#9298AA;
  --blue:#6B9FF5;--blue-d:#3F73D1;--blue-s:#E8F0FE;
  --crimson:#E4627F;--crimson-d:#C23F5F;--crimson-s:#FDEBEF;
  --cyan:#4FC3D8;--cyan-d:#2A93A8;--cyan-s:#E0F6FA;
  --violet:#D45FB0;--violet-d:#B03F90;--violet-s:#FBE9F5;
  --sh-1:0 1px 2px rgba(30,35,60,.05),0 4px 14px rgba(30,35,60,.05);
  --sh-2:0 2px 4px rgba(30,35,60,.06),0 16px 40px rgba(30,35,60,.12);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --display:'Outfit','Inter',system-ui,sans-serif;
  --app-h:100dvh;
  --ch:clamp(54px,calc((var(--app-h) - 64px) / 7 - 6px),92px);
  --cw:calc(var(--ch) * 1.28);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:var(--app-h);user-select:none;-webkit-user-select:none;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit}
.screen{display:none!important}.screen.active{display:block!important}
.ic{width:1em;height:1em;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.t-water{--c:#6B9FF5;--cd:#3F73D1;--cs:#E8F0FE}
.t-fire{--c:#EF6B6B;--cd:#CB3F3F;--cs:#FDEAEA}
.t-metal{--c:#A58AEA;--cd:#7A5FCC;--cs:#EEE9FC}
.t-plant{--c:#5CC98A;--cd:#2E9E5F;--cs:#E1F6EA}
.t-earth{--c:#DDA845;--cd:#A9701A;--cs:#FBF0D3}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 18px;font-weight:600;font-size:13px;cursor:pointer;transition:background .15s,border-color .15s,transform .15s,box-shadow .15s;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--ink-3);background:var(--surface-2)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .ic{font-size:15px}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover:not(:disabled){background:#383d4e;border-color:#383d4e}
.btn.violet{background:var(--violet-s);border-color:var(--violet);color:var(--violet-d)}
.btn.violet.on{background:var(--violet);color:#fff}
.btn.sm{padding:6px 12px;font-size:12px}
.btn.icon{padding:9px;border-radius:50%}

/* ── Selection screen ── */
.sel-top{display:flex;align-items:center;justify-content:space-between;max-width:1080px;margin:0 auto;padding:22px 24px 0}
.brand{display:flex;align-items:center;gap:11px}
.brand-mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(140deg,#9CC0FA,#B9A6F0);display:grid;place-items:center;color:#fff;box-shadow:var(--sh-1)}
.brand-mark .ic{font-size:20px;stroke-width:2}
.brand-name{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.22em;text-transform:uppercase}
.sel-wrap{max-width:1080px;margin:0 auto;padding:40px 24px 150px}
.sel-intro h1{font-family:var(--display);font-weight:600;font-size:34px;letter-spacing:-.01em}
.sel-intro p{color:var(--ink-2);margin-top:6px;max-width:520px}
.sort-bar{display:flex;flex-direction:column;gap:10px;margin:28px 0 20px}
.frow{display:flex;align-items:center;gap:14px}
.flabel{width:44px;font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.1em;flex-shrink:0}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 10px;font-weight:500;font-size:12.5px;color:var(--ink-2);cursor:pointer;transition:all .15s}
.fchip .ic{font-size:14px;color:var(--cd,var(--ink-2))}
.fchip:hover{border-color:var(--line-2);background:var(--surface-2)}
.fchip.on{background:var(--cs,var(--ink));border-color:var(--cd,var(--ink));color:var(--cd,#fff);font-weight:600}
.fchip[data-kind=skill].on{background:var(--ink);border-color:var(--ink);color:#fff}
.fchip[data-kind=skill].on .ic{color:#fff}
.no-match{grid-column:1/-1;text-align:center;color:var(--ink-3);padding:40px 0}
.cards-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.co{position:relative;cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s}
.co:hover{transform:translateY(-3px)}
.co .cd{height:100%;box-shadow:var(--sh-1)}
.co:hover .cd{box-shadow:var(--sh-2)}
.co.sel .cd{border-color:var(--cd);box-shadow:0 0 0 3px var(--cs),var(--sh-1)}
.co-check{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;background:var(--cd);color:#fff;display:grid;place-items:center;opacity:0;transform:scale(.6);transition:all .18s}
.co-check .ic{font-size:13px;stroke-width:2.6}
.co.sel .co-check{opacity:1;transform:none}

/* ── Card component ── */
.cd{position:relative;background:#fff;border:1.5px solid var(--c);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center}
.cd-name{font-family:var(--display);font-weight:600;color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cd-art{display:grid;place-items:center;border-radius:50%;background:var(--cs);color:var(--cd);flex-shrink:0}
.cd-beats{display:flex;align-items:center;justify-content:center;color:var(--ink-3)}
.cd-beats .bt{color:var(--cd);display:grid;place-items:center}
.cd-sk{display:flex;flex-wrap:wrap;justify-content:center;color:var(--ink-2)}
.m-full{padding:16px 10px 14px;gap:10px;min-height:196px}
.m-full .cd-name{font-size:15px}
.m-full .cd-art{width:56px;height:56px;font-size:28px}
.m-full .cd-beats{gap:4px;font-size:11px;font-weight:500;color:var(--ink-3)}
.m-full .cd-beats .ic{font-size:14px}
.m-full .cd-sk{gap:5px}
.sk-chip{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:2px 8px 2px 6px;font-size:11px;font-weight:500;color:var(--ink-2)}
.sk-chip .ic{font-size:12px}
.m-hand{width:100%;padding:13px 6px 9px;gap:7px}
.m-hand .cd-name{font-size:13px}
.m-hand .cd-art{width:40px;height:40px;font-size:21px}
.m-hand .cd-beats{gap:3px}.m-hand .cd-beats .ic{font-size:12px}
.m-hand .cd-sk{gap:6px}.m-hand .cd-sk .ic{font-size:14px}
.m-cell{width:100%;height:100%;justify-content:center;gap:2px;border:0;border-radius:0;background:none;padding:5px 3px 3px}
.m-cell .cd-name{font-size:10.5px;line-height:1.15}
.m-cell .cd-art{width:calc(var(--ch) * .32);height:calc(var(--ch) * .32);font-size:calc(var(--ch) * .19);background:var(--cs)}
.m-cell .cd-beats .ic{font-size:9px}.m-cell .cd-beats{gap:2px}
.m-cell .cd-sk{gap:3px}.m-cell .cd-sk .ic{font-size:10.5px}

/* franja de tipo: la misma en todas las cartas */
.cd::before{content:'';position:absolute;left:0;right:0;top:0;height:5px;background:var(--c)}
.m-cell::before{height:3px}
.m-cell{padding-top:calc(var(--ch) * .06)!important}
.m-full{padding-top:20px}
/* dark (P2) card variant: mismo diseño sobre gris oscuro */
.cd.dk{background:#2A2D39;border-color:color-mix(in srgb,var(--c) 55%,#2A2D39)}
.cd.dk.m-cell{background:none;border:0}
.cd.dk .cd-name{color:#EEF0F6}
.cd.dk .cd-art{background:color-mix(in srgb,var(--c) 28%,#2A2D39);color:var(--c)}
.cd.dk .cd-beats .bt{color:var(--c)}
.cd.dk .cd-sk{color:#B9BECE}

/* ── Selection dock ── */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.dock-in{max-width:1080px;margin:0 auto;padding:14px 24px;display:grid;grid-template-columns:auto 1fr auto;gap:26px;align-items:center}
.dock-slots{display:grid;grid-template-columns:repeat(8,34px);gap:6px}
.slot{width:34px;height:34px;border-radius:10px;border:1.5px dashed var(--line-2);display:grid;place-items:center;transition:all .15s}
.slot.full{border:1.5px solid var(--c);background:var(--cs);color:var(--cd);cursor:pointer;animation:pop .2s ease-out}
.slot.full:hover{background:var(--line)}
.slot .ic{font-size:17px}
.dock-info{font-size:12.5px;color:var(--ink-2);min-width:0;display:flex;flex-direction:column;gap:5px}
.dock-info b{font-family:var(--display);font-size:14px;font-weight:600;color:var(--ink)}
.dock-info .tip-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.dock-info .tip-desc{color:var(--ink-3)}
.dock-cta{display:flex;align-items:center;gap:14px}
.dock-count{font-family:var(--display);font-weight:600;font-size:15px;color:var(--ink-2);font-variant-numeric:tabular-nums}

/* ── Rules modal ── */
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(38,42,55,.28);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.modal.open{display:flex;animation:fade .2s ease-out}
.modal-box{background:var(--surface);border-radius:22px;box-shadow:var(--sh-2);width:100%;max-width:680px;max-height:calc(var(--app-h) - 40px);overflow:auto;padding:30px 32px 28px;user-select:text;-webkit-user-select:text}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.modal-head h2{font-family:var(--display);font-size:22px;font-weight:600}
.rule-sec{margin-top:22px}
.rule-sec h3{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.rule-sec p{color:var(--ink-2);font-size:13.5px}
.rule-sec p+p{margin-top:6px}
.rule-sec b{color:var(--ink);font-weight:600}
.beat-list{display:grid;grid-template-columns:1fr;gap:6px;margin-top:4px}
.beat-item{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:2px 10px;background:#fff;border:1.5px solid var(--c);border-radius:12px;padding:8px 12px;font-size:12.5px;color:var(--cd)}
.beat-item .bh{display:flex;align-items:center;gap:7px;font-weight:700;grid-row:1/3}
.beat-item .bh .ic{font-size:20px;box-sizing:content-box;padding:6px;border-radius:50%;background:var(--cs)}
.beat-item .bl{display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.beat-item .bl .ic{font-size:13px;color:var(--cd)}
.skill-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sk-row{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border-radius:12px;padding:10px 12px}
.sk-row .ic{font-size:18px;margin-top:1px;color:var(--ink)}
.sk-row strong{display:block;font-size:12.5px;font-weight:600}
.sk-row span{display:block;font-size:12px;color:var(--ink-2);line-height:1.4}

/* ── Game layout ── */
#game-screen.active{display:block!important}
.arena{min-height:var(--app-h);display:grid;grid-template-rows:auto;grid-template-columns:minmax(250px,310px) auto minmax(250px,310px);gap:30px;justify-content:center;align-items:stretch;padding:24px}
.col{display:flex;flex-direction:column;gap:14px;min-height:0}
.col-l{justify-content:flex-start}
.col-r{justify-content:flex-end}
.board-wrap{align-self:center}
.status{margin-bottom:auto}

/* ── Player panels ── */
.pn{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--sh-1);display:flex;flex-direction:column;gap:14px;transition:border-color .3s,box-shadow .3s}
.pn.active.p-p1{border-color:var(--ink-2);box-shadow:0 0 0 4px rgba(38,42,55,.08),var(--sh-1)}
.pn-ai{background:#2A2D39;border-color:#3D4150;color:#EEF0F6;box-shadow:0 2px 10px rgba(30,35,60,.18)}
.pn.active.p-ai{border-color:#8087A3;box-shadow:0 0 0 4px rgba(42,45,57,.12),0 2px 10px rgba(30,35,60,.18)}
.pn.flash{animation:flash .9s ease-out}
.pn-head{display:flex;align-items:center;gap:12px}
.pn-avatar{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.pn-avatar .ic{font-size:20px}
.p-p1 .pn-avatar{background:var(--surface-2);color:var(--ink)}
.p-ai .pn-avatar{background:#3A3E4E;color:#E4E7F0}
.pn-ai .pn-name{color:#fff}.pn-ai .pn-state,.pn-ai.active .pn-state{color:#9AA0B4}.pn-ai .pn-temples{background:#343848}.pn-ai .pn-stats,.pn-ai .deck-chip{color:#9AA0B4}.pn-ai .acts-txt,.pn-ai .deck-chip b{color:#fff}.pn-ai .acts .ic{color:#4A4F61}.pn-ai .acts .ic.on{color:#E4E7F0;fill:#4A4F61}
.pn-name{font-family:var(--display);font-weight:600;font-size:16px;line-height:1.2}
.pn-state{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.pn.active .pn-state{color:var(--ink-2)}
.pn-temples{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;background:var(--surface-2);border-radius:12px;padding:10px 14px}
.pt{display:flex;flex-direction:column;align-items:center;gap:5px}
.pt .ic{font-size:20px}.pt.big .ic{font-size:27px}
.p-p1 .pt .ic{color:var(--ink)}.p-ai .pt .ic{color:#E4E7F0}
.pt.dead .ic{color:var(--line-2)!important}
.pips{display:flex;gap:3px}
.pip{width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.pt.big .pip{width:8px;height:8px}
.p-p1 .pip.on{background:var(--ink)}.p-ai .pip{background:#4A4F61}.p-ai .pip.on{background:#E4E7F0}
.pn-stats{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--ink-2)}
.acts{display:flex;align-items:center;gap:3px}
.acts .ic{font-size:16px;color:var(--line-2)}
.acts .ic.on{color:var(--cyan-d);fill:var(--cyan-s)}
.acts-txt{font-weight:600;margin-left:6px;font-variant-numeric:tabular-nums;color:var(--ink)}
.deck-chip{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.deck-chip .ic{font-size:15px}
.deck-chip b{color:var(--ink-2);font-weight:600}

/* ── Hands ── */
.hand-title{font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.ai-hand{display:flex;gap:6px}
.card-back{flex:1;max-width:58px;aspect-ratio:3/4;border-radius:10px;background:linear-gradient(145deg,#3A3E4E,#2A2D39);border:1.5px solid #4A4F61;display:grid;place-items:center;color:#7C829A}
.card-back .ic{font-size:18px;stroke-width:1.6}
.hand-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.hcard{cursor:pointer;transition:transform .18s,box-shadow .18s,opacity .18s;border-radius:14px}
.hcard .cd{box-shadow:var(--sh-1);transition:border-color .15s,box-shadow .18s}
.hcard:hover .cd{box-shadow:var(--sh-2)}
.hcard:hover{transform:translateY(-3px)}
.hcard.hsel .cd{border-color:var(--cd);box-shadow:0 0 0 3px var(--cs),var(--sh-2)}
.hcard.hsel{transform:translateY(-4px)}
.hcard.hdim{opacity:.5;cursor:default;pointer-events:none}
.hand-empty{grid-column:1/-1;text-align:center;font-size:12.5px;color:var(--ink-3);padding:18px 0;border:1.5px dashed var(--line-2);border-radius:14px}

/* ── Board ── */
.board{display:grid;grid-template-columns:repeat(3,var(--cw));grid-template-rows:repeat(7,var(--ch));gap:6px;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh-1);transition:opacity .3s}
.board.dimmed{opacity:.7;pointer-events:none}
.cell{--ring:var(--cyan);background:var(--surface-2);border:1.5px solid var(--line);border-radius:12px;position:relative;display:grid;place-items:center;overflow:hidden;transition:background .15s,border-color .15s,box-shadow .15s}
.cell.clickable{cursor:pointer}
.cell.c-p1{background:#fff;border-color:var(--c,#CBD2E0);box-shadow:0 2px 6px rgba(30,35,60,.10)}
.cell.c-ai{background:#2A2D39;border-color:color-mix(in srgb,var(--c,#4A4F61) 55%,#2A2D39);box-shadow:0 2px 6px rgba(30,35,60,.22)}
.cell.enter .cd{animation:pop .28s cubic-bezier(.2,.9,.3,1.3)}
.cell.sel-cell{border-color:var(--ink)!important;box-shadow:0 0 0 3px rgba(38,42,55,.12)}
.cell.vmove{--ring:var(--cyan);background:var(--cyan-s);border-color:var(--cyan);animation:ring 1.4s ease-out infinite}
.cell.vmove:not(:has(.cd))::after{content:'';width:9px;height:9px;border-radius:50%;background:var(--cyan)}
.cell.vattk,.cell.vattk-temple{--ring:var(--crimson);border-color:var(--crimson);animation:ring 1.4s ease-out infinite}
.cell.vattk{background:var(--crimson-s)}
.cell.vattk-temple{background:var(--crimson-s)}
.cell.vranged{--ring:var(--violet);background:var(--violet-s);border-color:var(--violet);animation:ring 1.4s ease-out infinite}
.cell.vcombo{--ring:var(--violet);background:var(--violet-s);border-color:var(--violet);animation:ring 1.4s ease-out infinite;z-index:2}
.cell.vcombo-lose{--ring:var(--crimson);background:var(--crimson-s)!important;border-color:var(--crimson)!important;animation:ring 1.4s ease-out infinite;z-index:2}
.cell.temple{background:var(--surface)}
.cell.temple.o-p1{background:#fff;border-color:#CBD2E0;box-shadow:0 2px 6px rgba(30,35,60,.10)}
.cell.temple.o-ai{background:#2A2D39;border-color:#3D4150;box-shadow:0 2px 6px rgba(30,35,60,.22)}
.cell.temple.hit{animation:shake .4s ease-out}
.tpl{display:flex;flex-direction:column;align-items:center;gap:calc(var(--ch) * .05)}
.tpl .ic{font-size:calc(var(--ch) * .34)}
.tpl.big .ic{font-size:calc(var(--ch) * .42)}
.o-p1 .tpl .ic{color:var(--ink)}.o-ai .tpl .ic{color:#E4E7F0}.o-ai .tpl-label{color:#9AA0B4}
.tpl-label{font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.tpl .pips .pip{width:6px;height:6px}
.o-p1 .tpl .pip.on{background:var(--ink)}.o-ai .tpl .pip{background:#4A4F61}.o-ai .tpl .pip.on{background:#E4E7F0}

/* ── Status / controls ── */
.status{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:10px;line-height:1.4}

/* ── Log ── */
.log{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh-1);display:flex;flex-direction:column;min-height:140px;flex:1 1 0;overflow:hidden}

.log-entry.sep::after{content:'';flex:1;height:1px;background:var(--line)}
.log-entry.sep b{color:var(--ink-3)}

/* ── Game over ── */
.over{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(243,244,248,.7);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);animation:fade .35s ease-out}

.over-title{font-family:var(--display);font-size:28px;font-weight:600}
.over-sub{color:var(--ink-2);margin:6px 0 26px;font-size:13.5px}
.over-btns{display:flex;flex-direction:column;gap:8px}

/* ── Motion ── */
@keyframes pop{from{transform:scale(.82);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ring) 50%,transparent)}100%{box-shadow:0 0 0 8px color-mix(in srgb,var(--ring) 0%,transparent)}}

@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

function _kwScore(cd){let s=0;if(cd.kw.includes('🤜'))s+=6;if(cd.kw.includes('⏫'))s+=5;if(cd.kw.includes('↔️'))s+=4;if(cd.kw.includes('🏹'))s+=3;if(cd.kw.includes('💣'))s+=2;if(cd.kw.includes('⬇️'))s+=1;return s;}
const TYPE_ORDER=['water','fire','metal','plant','earth'];
let G_cardOrder=[...CARDS].sort((a,b)=>{const td=TYPE_ORDER.indexOf(a.type)-TYPE_ORDER.indexOf(b.type);return td!==0?td:_kwScore(b)-_kwScore(a);}).map(c=>c.id);
let G_fType=new Set(),G_fSkill=new Set();
function cardPasses(c){return(!G_fType.size||G_fType.has(c.type))&&[...G_fSkill].every(k=>hK(c,k));}
function toggleHomeMenu(force){
  const m=document.getElementById('home-menu'),on=force!==undefined?force:m.style.display==='none';
  if(on){toggleFilterPanel(false);m.innerHTML='';
    const it=(icn,label,fn)=>{const b=el('button','menu-item');b.innerHTML=ic(icn)+label;b.onclick=()=>{toggleHomeMenu(false);fn();};return b;};
    m.appendChild(it('help','Reglas y tutorial',()=>openRules()));
    m.appendChild(it(window._muted?'mute':'sound','Sonido',()=>{window._muted=!window._muted;try{localStorage.setItem('spire-mute',window._muted?'1':'');}catch(e){}}));}
  m.style.display=on?'grid':'none';
}
document.addEventListener('click',e=>{const m=document.getElementById('home-menu');if(m&&m.style.display!=='none'&&!e.target.closest('#home-menu')&&!e.target.closest('#opt-btn'))toggleHomeMenu(false);});
function toggleFilterPanel(force){const p=document.getElementById('sort-bar'),on=force!==undefined?force:!p.classList.contains('open');if(on)toggleHomeMenu(false);p.classList.toggle('open',on);document.getElementById('filter-btn').setAttribute('aria-expanded',String(on));}
document.addEventListener('click',e=>{const p=document.getElementById('sort-bar');if(p&&p.classList.contains('open')&&!e.target.closest('#sort-bar')&&!e.target.closest('#filter-btn'))toggleFilterPanel(false);});
function updateFilterBadge(){const n=G_fType.size+G_fSkill.size,b=document.getElementById('fbadge');if(b){b.textContent=n?String(n):'';b.style.display=n?'inline-grid':'none';}}
function toggleFilter(kind,k){const st=kind==='type'?G_fType:G_fSkill;if(st.has(k))st.delete(k);else st.add(k);buildSelGrid();}
function buildSortBar(){
  const chip=(kind,k,tcls)=>'<button class="fchip'+(tcls?' t-'+k:'')+'" data-kind="'+kind+'" data-k="'+k+'" onclick="toggleFilter(\''+kind+'\',\''+k+'\')">'+ic(k)+'<span class="fl">'+(kind==='type'?TYPE_NAME[k]:SKILL_NAME[k])+'</span></button>';
  document.getElementById('sort-bar').innerHTML=
    '<div class="frow"><div class="fchips">'+['water','fire','metal','plant','earth'].map(t=>chip('type',t,1)).join('')+'</div></div>'
   +'<div class="frow"><div class="fchips">'+SKILLS.map(k=>chip('skill',k,0)).join('')+'</div></div>';
}
function updateSelUI(){
  const n=G.p1sel.length;
  document.getElementById('btn-confirm1').disabled=n!==8;
  const cl=document.getElementById('btn-clear1');if(cl)cl.disabled=!n;
  const slots=document.getElementById('slots1');slots.innerHTML='';
  for(let i=0;i<8;i++){
    const card=CARDS.find(c=>c.id===G.p1sel[i]);
    const s=el('div','slot'+(card?' full t-'+card.type:''));
    if(card){s.innerHTML=ic(card.type);s.addEventListener('click',()=>toggleCard(card.id));}
    slots.appendChild(s);
  }
}
function toggleCard(id){
  const i=G.p1sel.indexOf(id);
  if(i>=0)G.p1sel.splice(i,1);else if(G.p1sel.length<8)G.p1sel.push(id);
  buildSelGrid();
}
function buildSelGrid(){
  const grid=document.getElementById('grid1');grid.innerHTML='';
  document.querySelectorAll('#sort-bar .fchip').forEach(b=>b.classList.toggle('on',(b.dataset.kind==='type'?G_fType:G_fSkill).has(b.dataset.k)));updateFilterBadge();
  const shown=G_cardOrder.map(id=>CARDS.find(c=>c.id===id)).filter(c=>c&&cardPasses(c));
  if(!shown.length){const n=el('div','no-match');n.textContent='Ninguna carta coincide con los filtros.';grid.appendChild(n);}
  shown.forEach(card=>{
    const div=el('div','co t-'+card.type+(G.p1sel.includes(card.id)?' sel':''));
    div.innerHTML=cardHTML(card,'full')+'<div class="co-check">'+ic('check')+'</div>';
    div.addEventListener('click',()=>toggleCard(card.id));
    grid.appendChild(div);
  });
  updateSelUI();
}
function openRules(){

  const act=(icn,t,d)=>'<div class="act-row">'+ic(icn)+'<div><b>'+t+'.</b> '+d+'</div></div>';

    +'<button class="btn primary tut-open" onclick="closeRules();openTutorial()">'+ic('play')+'Ver el tutorial paso a paso</button>'
    +sec(1,'Objetivo','<p>Destruí el templo <b>Central</b> rival (3 vidas) <b>o</b> sus dos templos <b>Chicos</b> (2 vidas cada uno). Perdés si eso les pasa a los tuyos, incluso por reponer.</p>')
    +sec(2,'Preparación','<p>Elegí <b>8 de las 20 cartas</b>: se mezclan y robás 4. Empieza uno al azar. Tenés <b>1 acción</b> por turno.</p>')
    +sec(3,'La carta','<div class="rule-card"><div class="t-'+demo.type+'" style="width:112px;flex:none">'+cardHTML(demo,'hand')+'</div><ul class="steps" style="list-style:none;padding:0"><li><b>Círculo:</b> su tipo.</li><li><b>Espadas:</b> los tipos a los que vence.</li><li><b>Íconos de abajo:</b> sus skills (sección 7).</li></ul></div>')
    +sec(4,'Tu turno','<p>Gastá <b>todas</b> tus acciones, una por una. No se puede pasar: si solo te queda reponer, reponés; si no hay ninguna jugada posible, el turno termina solo. Al terminar, reponés hasta tener 4 cartas (mientras haya mazo).</p><div class="acts-list">'
      +act('deck','Desplegar','una carta de tu mano a una celda de tu <b>fila de despliegue</b> (la pegada a tus templos), libre o con una carta rival, que se combate.')
      +act('F','Mover o atacar','una carta tuya puede avanzar 1 paso hacia el rival. Si ahí hay una carta rival, la atacás; si hay un templo rival, lo golpeás. No se entra a celdas con cartas propias ni ruinas.')
      +act('ranged','Disparar','solo cartas con Disparo.')
      +act('refresh','Reponer','el descarte se mezcla con el mazo, completás la mano a 4 al instante y un templo tuyo, a tu elección, pierde 1 vida.')
      +'</div>')
    +sec(5,'Combate','<p>El resultado lo define el <b>tipo</b>. El ganador queda en la celda del defensor y el perdedor va al <b>descarte</b>. Mismo tipo: empate, ambas al descarte (salvo Blast, sección 7).</p><div class="beat-list">'+beats+'</div>')
    +sec(6,'Templos','<p>Cada golpe le saca <b>1 vida</b> y la carta que golpea va al descarte. Un templo sin vidas queda en <b>ruinas</b> y no se puede cruzar. Cada vida que pierde un templo (por golpe o por reponer) le da a su dueño <b>+1 acción por turno</b>, desde su próximo turno y para siempre.</p>')

const TUT={i:0,f:0,timer:null,steps:null};
function tutTypeTable(){return['water','fire','metal','plant','earth'].map(t=>'<div class="beat-item t-'+t+'"><div class="bh">'+ic(t)+TYPE_NAME[t]+'</div>'+TYPE_BEATS[t].map(b=>'<div class="bl">'+ic('swords')+'<span>'+(BEAT_PHRASE[t][b][0].toUpperCase()+BEAT_PHRASE[t][b].slice(1))+'</span></div>').join('')+'</div>').join('');}
function tutBoardHTML(specs,rows){
  const b=el('div','tut-board');b._pos={};b.style.gridTemplateRows='repeat('+rows+',var(--ch))';
  const cells=[];for(let r=0;r<rows;r++)for(let c=0;c<3;c++){const e=el('div','cell');b.appendChild(e);cells.push(e);}
  const at=(r,c)=>cells[r*3+c];
  for(const sp of specs){
    const e=at(sp.r,sp.c);if(!e)continue;
    if(sp.k==='card'){b._pos[sp.inst]=sp.r+','+sp.c;e.classList.add('c-'+sp.own,'t-'+sp.card.type);e.innerHTML=cardHTML(sp.card,'cell',sp.own==='ai');if(sp.pop)e.classList.add('enter');}
    else if(sp.k==='tpl'){const big=sp.c===1;e.classList.add('temple','o-'+sp.own);let pips='';for(let i=0;i<(big?3:2);i++)pips+='<span class="pip'+(i<sp.hp?' on':'')+'"></span>';e.innerHTML='<div class="tpl'+(big?' big':'')+'">'+ic(big?'tower':'temple')+'<div class="pips">'+pips+'</div></div>';if(sp.hit)e.classList.add('hit');}
    else if(sp.k==='ruin'){e.classList.add('is-ruin');e.innerHTML='<div class="ruin">'+ic('ruin')+'</div>';}
    else if(sp.k==='hl')e.classList.add(sp.cls);
  }
  return b;
}
function tutSteps(){
  if(TUT.steps)return TUT.steps;
  const C=n=>CARDS.find(c=>c.name===n),has=(c,k)=>hK(c,k);
  const water=C('Vórtice'),fire=C('Llamarada'),car=C('Alud'),sb=CARDS.find(c=>has(c,'S')&&has(c,'B')&&!has(c,'blast')&&!has(c,'ranged'))||C('Maretazo');
  const rng=CARDS.find(c=>has(c,'ranged')&&!has(c,'blast')),cmb=CARDS.find(c=>has(c,'combo')&&!has(c,'blast')),bl=CARDS.find(c=>has(c,'blast'));
  const e1=CARDS.find(c=>TYPE_BEATS[rng.type].includes(c.type)&&!has(c,'blast')),
        ce=CARDS.filter(c=>TYPE_BEATS[cmb.type].includes(c.type)&&!has(c,'blast'));

  const H=(r,c,cls)=>({k:'hl',r,c,cls});
  const T=(own,hp,hit)=>[0,1,2].map(c=>({k:'tpl',own,r:own==='ai'?0:4,c,hp:hp[c],hit:hit===c}));
  const base=(ai=[2,3,2],hit)=>[...T('ai',ai,hit),...T('p1',[2,3,2])];
  const board=(frames,anim)=>({board:frames.map(f=>[...f]),rows:5,anim});
  return TUT.steps=[
    {t:'Objetivo',x:'Destruí el templo <b>Central</b> rival (3 vidas) <b>o</b> sus dos templos <b>Chicos</b> (2 vidas cada uno). Perdés si eso les pasa a los tuyos.',
      scene:board([base(),[...base([2,0,2]),{k:'ruin',r:0,c:1}]])},
    {t:'Elegí tu mazo',x:'Tocá <b>8 de las 20 cartas</b>, o usá <b>Auto</b> para un mazo bueno y distinto cada vez. Los filtros de tipo y skill ayudan a buscar. Arriba, en el centro, elegís la <b>dificultad</b>.',custom:'deck'},
    {t:'La carta',x:'Cada carta tiene un <b>tipo</b> (el círculo), los tipos a los que <b>vence</b> (las espadas) y sus <b>skills</b> (los íconos de abajo). Mantené apretada o pasá el mouse para ver detalles.',custom:'card'},
    {t:'Tipos',x:'En un combate gana el tipo que vence al otro. <b>Mismo tipo: empate</b> y las dos cartas van al descarte.',custom:'types'},
    {t:'Tu turno',x:'Tenés <b>acciones</b> por turno (empezás con 1). Cada jugada gasta una. No se puede pasar el turno. Al terminar, reponés hasta tener 4 cartas.',custom:'turn'},
    {t:'Desplegar',x:'Tocá una carta de tu mano y después una celda marcada de tu <b>fila de despliegue</b>, la pegada a tus templos.',
      scene:board([[...base(),H(3,0,'vmove'),H(3,1,'vmove'),H(3,2,'vmove')],[...base(),P(3,1,water,true)]])},
    {t:'Avanzar',x:'Tocá una carta tuya del tablero y una celda marcada. Las cartas pueden avanzar <b>1 paso</b> hacia el rival.',
      scene:board([[...base(),P(3,1,water),H(2,1,'vmove')],[...base(),P(2,1,water)]],[null,()=>fxSlide(M(water,'p1'),3,1,2,1)])},
    {t:'Atacar',x:'Si la celda marcada en rojo tiene un rival, lo atacás. <b>El resultado lo define el tipo</b>: el ganador ocupa la celda y el perdedor va al descarte.',
      scene:board([[...base(),P(2,1,water),E(1,1,fire),H(1,1,'vattk')],[...base(),P(1,1,water)]],[null,()=>fxClash('A',M(water,'p1'),M(fire,'ai'),2,1,1,1)])},
    {t:'Skill: Carga',x:'La Carga se mueve <b>hasta 2 pasos</b> por acción, o hasta que ataque.',
      scene:board([[...base(),P(3,1,car),H(2,1,'vmove'),H(1,1,'vmove')],[...base(),P(1,1,car)]],[null,()=>fxSlide(M(car,'p1'),3,1,1,1)])},
    {t:'Skills: Flanquea y Retrocede',x:'<b>Flanquea</b> permite mover y atacar a los costados; <b>Retrocede</b>, hacia atrás. Los pasos de cada carta son los que marca su skill.',
      scene:board([[...base(),P(2,1,sb),H(1,1,'vmove'),H(2,0,'vmove'),H(2,2,'vmove'),H(3,1,'vmove')]])},
    {t:'Skill: Disparo',x:'En vez de mover, <b>dispara en línea recta</b> a la primera carta que encuentre (en las direcciones en que la carta puede moverse). La mata salvo que su tipo venza al tuyo. <b>No daña templos</b>.',
      scene:board([[...base(),P(3,1,rng),E(1,1,e1),H(1,1,'vranged')],[...base(),P(3,1,rng)]],[null,()=>{fx({k:'shot',fr:3,fc:1,tr:1,tc:1,tn:'win',dur:260});fx({k:'ghost',g:ghostOf(M(e1,'ai')),r:1,c:1,dieAt:260,tn:'win'});fx({k:'burst',r:1,c:1,icon:'ranged',tn:'win',at:260});}])},
    {t:'Skill: Combo',x:'Tras ganar un combate, la carta puede <b>seguir atacando</b> a otra carta o templo vecino, sin gastar otra acción, mientras siga ganando.',

    {t:'Skill: Blast',x:'Si una carta con <b>Blast</b> participa en un combate cuerpo a cuerpo, <b>ambas cartas van al descarte</b>, sin mirar los tipos.',
      scene:board([[...base(),P(3,1,bl),E(2,1,fire),H(2,1,'vattk')],[...base()]],[null,()=>fxClash('blast',M(bl,'p1'),M(fire,'ai'),3,1,2,1)])},
    {t:'Atacar templos',x:'Atacar un templo le saca <b>1 vida</b> y tu carta va al descarte. Sin vidas queda en ruinas. Cada vida que pierde un templo le da a su dueño <b>+1 acción por turno</b>, para siempre.',
      scene:board([[...base(),P(1,1,water),H(0,1,'vattk-temple')],[...base([2,2,2],1)]],[null,()=>{const d=fxSlide(M(water,'p1'),1,1,0,1);fxSeq(d);fx({k:'burst',r:0,c:1,icon:'temple',tn:'win',at:0});fx({k:'float',r:0,c:1,text:'−1',tn:'win',at:120});}])},
    {t:'Reponer',x:'Podés <b>reponer</b> (1 acción): el descarte vuelve al mazo, completás la mano a 4 y un templo tuyo, a tu elección, <b>pierde 1 vida</b>. Es obligatorio si no tenés otra jugada.',custom:'repo'},
    {t:'¡A jugar!',x:'Ganás destruyendo templos. Probá <b>Fácil</b> para empezar y usá <b>Auto</b> para armar el mazo. Podés volver a ver este tutorial desde <b>Opciones → Reglas</b>.',custom:'end'}
  ];
}
function tutCustom(kind,f){
  const d=el('div');
  if(kind==='deck'){
    const ids=G_cardOrder.slice(0,8),n=[0,2,5,8][f%4];
    d.className='tut-slots';
    d.innerHTML='<div class="tut-chips"><div class="seg"><button>Fácil</button><button class="on">Normal</button><button>Difícil</button></div><span class="btn sm">'+ic('refresh')+'Auto</span></div><div class="dock-slots">'+Array.from({length:8},(_,i)=>{const c=CARDS.find(x=>x.id===ids[i*2%ids.length]);return i<n?'<div class="slot full t-'+c.type+'">'+ic(c.type)+'</div>':'<div class="slot"></div>';}).join('')+'</div><div class="dock-count" style="display:block">'+n+' / 8</div>';
  }else if(kind==='card'){
    const c=CARDS.find(x=>hK(x,'charge')&&hK(x,'S'))||CARDS[0];d.className='tut-card';
    d.innerHTML='<div class="t-'+c.type+'" style="width:118px;flex:none">'+cardHTML(c,'hand')+'</div><div class="tc-l"><span><b>Franja y borde:</b> su color</span><span><b>Círculo:</b> tipo</span><span><b>Espadas:</b> a quién vence</span><span><b>Íconos:</b> skills</span></div>';
  }else if(kind==='types'){d.className='beat-list';d.style.width='100%';d.innerHTML=tutTypeTable();}
  else if(kind==='turn'){
    const max=2,left=[2,1,0][f%3];let bolts='';for(let i=0;i<max;i++)bolts+=ic('bolt',i<left?'on':'');
    d.innerHTML='<div class="tut-pn"><span class="acts">'+bolts+'<span class="acts-txt'+(f%3?' flash':'')+'">'+left+'/'+max+'</span></span><span>'+(f%3===2?'Turno terminado: robás hasta 4':'Acciones disponibles')+'</span></div>';
  }else if(kind==='repo'){
    const after=f%2===1;
    d.className='tut-slots';
    d.innerHTML='<div class="tut-pn"><span class="deck-chip">'+ic('deck')+'<b'+(after?' class="flash"':'')+'>'+(after?1:0)+'</b></span><span class="deck-chip">'+ic('trash')+'<b'+(after?' class="flash"':'')+'>'+(after?0:5)+'</b></span><span>Mano: '+(after?4:0)+'</span></div><div class="tut-chips"><span class="btn sm'+(after?'':' primary')+'">'+ic('refresh')+'Reponer</span></div><div class="dock-slots" style="grid-template-columns:repeat(3,34px)"><div class="slot full t-water">'+ic('temple')+'</div><div class="slot full t-fire">'+ic('tower')+'</div><div class="slot'+(after?'':' full t-water')+'">'+(after?'':ic('temple'))+'</div></div>';
  }else if(kind==='end'){d.className='tut-end';d.innerHTML=ic('trophy')+'<div>Destruí el templo Central o los dos Chicos.</div>';}
  return d;
}
function tutRender(){
  const steps=tutSteps(),st=steps[TUT.i],box=document.getElementById('tut-box');
  clearTimeout(TUT.timer);TUT.f=0;
  box.innerHTML='<div class="tut-top"><span class="tut-count">Paso '+(TUT.i+1)+' de '+steps.length+'</span><button class="btn icon sm" onclick="closeTutorial()" aria-label="Cerrar tutorial">'+ic('close')+'</button></div>'
    +'<div class="tut-scene" id="tut-scene"></div><div class="tut-text"><h2>'+st.t+'</h2><p>'+st.x+'</p></div>'
    +'<div class="tut-nav"><button class="btn sm" id="tut-prev" onclick="tutGo(-1)"'+(TUT.i?'':' disabled')+'>'+ic('left')+'Anterior</button><div class="tut-dots">'+steps.map((_,i)=>'<i class="'+(i===TUT.i?'on':'')+'"></i>').join('')+'</div><button class="btn sm primary" onclick="'+(TUT.i===steps.length-1?'closeTutorial()':'tutGo(1)')+'">'+(TUT.i===steps.length-1?'Listo':'Siguiente'+ic('right'))+'</button></div>';
  const paint=()=>{const sc=document.getElementById('tut-scene');if(!sc)return;sc.innerHTML='';
    if(st.custom)sc.appendChild(tutCustom(st.custom,TUT.f));
    else{const fr=st.scene.board,idx=TUT.f%fr.length,bd=tutBoardHTML(fr[idx],st.scene.rows);sc.appendChild(bd);
      const a=st.scene.anim&&st.scene.anim[idx];
      if(a){G._fx=[];G._fxT=0;a();playFx(bd,bd._pos);}}};
  paint();
  const n=st.custom==='deck'?4:st.custom==='turn'?3:st.custom==='repo'?2:(st.scene?st.scene.board.length:1);
  const an=st.scene&&st.scene.anim,wait=()=>{const f=TUT.f%n,cur=an&&an[f],nxt=an&&an[(f+1)%n];return nxt?(cur?1500:700):(an?2200:1500);};
  const tick=()=>{TUT.timer=setTimeout(()=>{TUT.f++;paint();tick();},wait());};
  if(n>1)tick();
}
function tutGo(d){const n=tutSteps().length;TUT.i=Math.max(0,Math.min(n-1,TUT.i+d));tutRender();}
function openTutorial(){ttHide();TUT.i=0;tutRender();document.getElementById('tut-modal').classList.add('open');}

// Reponer (1 acción): el templo elegido pierde 1 vida (y da la acción extra permanente de siempre); el descarte vuelve al mazo y la mano se completa a 4 al instante
function payLife(who,col){
  const p=gP(who),n=dc(p).length;

}

// t = tiempo (ms) donde ocurre cada paso dentro de la acción; se encadenan en combos
function fx(o){if(G._sim)return;const T=G._fxT||0;o={...o,at:(o.at||0)+T};
  if(o.k==='slide'){const m=G._slideEnd=G._slideEnd||{};if(m[o.inst]>o.at)o.at=m[o.inst];m[o.inst]=o.at+o.dur;}if(o.dieAt!=null)o.dieAt+=T;if(o.show!=null)o.show+=T;(G._fx=G._fx||[]).push(o);}
function fxSeq(ms){G._fxT=(G._fxT||0)+ms;}
// Carga con 2 pasos en diagonal: se anima en "L" (primero una celda y después la otra), pasando por una celda libre permitida
function chargeVia(ci,fr,fc,tr,tc){
  const dr=tr-fr,dc=tc-fc;if(Math.abs(dr)!==1||Math.abs(dc)!==1)return null;
  const fd=fwd(ci.owner),ok=(r,c)=>inB(r,c)&&!isRuin(r,c)&&!G.board[r][c];
  if(!((dr===fd||hK(ci.cd,'B'))&&hK(ci.cd,'S')))return null;
  if(ok(fr+dr,fc))return{r:fr+dr,c:fc};      // primero vertical y después al costado
  if(ok(fr,fc+dc))return{r:fr,c:fc+dc};      // o al revés si esa celda está ocupada
  return null;
}
function fxSlide(ci,fr,fc,tr,tc){
  const via=chargeVia(ci,fr,fc,tr,tc);
  const dur=via?440:300;fx({k:'slide',inst:ci.inst,g:ghostOf(ci),fr,fc,tr,tc,via,dur});return dur;
}
function fxClash(res,mover,tgt,fr,fc,tr,tc){
  // mover: carta que ataca (puede venir de la mano si fr<0); tgt: carta atacada, en (tr,tc)
  const via=fr>=0?chargeVia(mover,fr,fc,tr,tc):null;
  const dep=fr<0;                                   // se desplegó sobre un rival: la carta se ve caer un momento encima
  const t0=dep?420:(via?440:300);
  if(!dep)fxSlide(mover,fr,fc,tr,tc);else fx({k:'hold',inst:mover.inst,until:t0});
  const kind=res==='A'?'win':res==='B'?'lose':res;                      // win | lose | blast | tie
  const icon=kind==='blast'?'blast':kind==='tie'?'tie':'swords';
  const tn=kind==='blast'?'blast':kind==='tie'?'none':tone(kind==='win'?mover.owner:tgt.owner);
  fx({k:'ghost',g:ghostOf(tgt),r:tr,c:tc,dieAt:t0,tn});                      // el rival se ve hasta el golpe
  if(dep)fx({k:'ghost',g:ghostOf(mover),r:tr,c:tc,show:0,dieAt:kind==='win'?t0:t0+90,tn,drop:true,fade:kind==='win'?60:null});
  else if(kind!=='win')fx({k:'ghost',g:ghostOf(mover),r:tr,c:tc,show:t0,dieAt:t0+90,tn});   // el atacante llega y también cae
  fx({k:'burst',r:tr,c:tc,icon,tn,at:t0});
  fxSeq(t0+640);
}
// Lo que pasa se muestra en el estado, uno por vez, con un tiempo mínimo para leerlo; si se acumulan, cada uno dura menos
const STQ={q:[],cur:null,last:'',timer:0};
function shortEvt(msg){
  let t=fmtLog(msg.replace(/<[^>]+>/g,'')).replace(/\s*\((Agua|Fuego|Metal|Planta|Tierra)\)/g,'');
  if(/^Empate/.test(t))t='Empate: ambas cartas al descarte';
  else t=t.split(/: |\. /)[0];
  return t.length>70?t.slice(0,67)+'…':t;
}
function statusPush(msg,type){
  if(type==='ai-logic'||type==='ai-error'||msg.indexOf('──')===0)return;
  const t=shortEvt(msg);if(!t||t===STQ.cur||t===STQ.q[STQ.q.length-1])return;
  STQ.q.push(t);if(STQ.q.length>8)STQ.q.shift();
  if(!STQ.cur)statusNext();
}
function statusNext(){
  clearTimeout(STQ.timer);
  if(!STQ.q.length){STQ.cur=null;statusRefresh();return;}
  STQ.cur=STQ.q.shift();STQ.last=STQ.cur;
  const n=STQ.q.length;let d=Math.min(2300,1100+STQ.cur.length*18);
  d*=n>=4?0.3:n>=2?0.55:n>=1?0.8:1;
  statusRefresh();STQ.timer=setTimeout(statusNext,Math.max(350,d));
}

const _AC=new(window.AudioContext||window.webkitAudioContext)();
function _resume(){if(_AC.state==='suspended')_AC.resume();}
function _tone(freq,type,vol,dur,fadeStart,pitchEnd){
  if(G._sim||window._muted)return;
  _resume();
  const o=_AC.createOscillator(),g=_AC.createGain();
  o.connect(g);g.connect(_AC.destination);
  o.type=type||'sine';o.frequency.setValueAtTime(freq,_AC.currentTime);
  if(pitchEnd)o.frequency.exponentialRampToValueAtTime(pitchEnd,_AC.currentTime+dur);
  g.gain.setValueAtTime(vol||0.18,_AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,_AC.currentTime+(fadeStart||dur));
  o.start();o.stop(_AC.currentTime+dur);
}
function _noise(vol,dur,type){
  if(G._sim||window._muted)return;
  _resume();
  const buf=_AC.createBuffer(1,_AC.sampleRate*dur,_AC.sampleRate);
  const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1);
  const src=_AC.createBufferSource(),g=_AC.createGain(),f=_AC.createBiquadFilter();
  f.type=type||'bandpass';f.frequency.value=600;f.Q.value=0.8;
  src.buffer=buf;src.connect(f);f.connect(g);g.connect(_AC.destination);
  g.gain.setValueAtTime(vol||0.15,_AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,_AC.currentTime+dur);
  src.start();src.stop(_AC.currentTime+dur);
}

function validMoveCells(r,c,who){
  const cell=G.board[r][c]; if(!cell||cell.t!=='card')return[];
  const fd=fwd(who),isCharge=hK(cell.cd,'charge'),res=new Map();
  function add(tr,tc,vt){const k=tr+','+tc;if(!res.has(k)||(vt==='attk'&&res.get(k).vt==='move'))res.set(k,{r:tr,c:tc,vt});}
  const dirs=[[fd,0]];if(hK(cell.cd,'S'))dirs.push([0,-1],[0,1]);if(hK(cell.cd,'B'))dirs.push([-fd,0]);
  for(const[dr,dc]of dirs){
    const tr=r+dr,tc=c+dc;if(!inB(tr,tc)||isRuin(tr,tc))continue;
    const t=G.board[tr][tc];
    if(!t){
      add(tr,tc,'move');
      // Carga: un 2.º paso por acción, en cualquier dirección que permita la carta; si ahí hay un rival lo ataca
      if(isCharge)for(const[er,ec]of dirs){
        const xr=tr+er,xc=tc+ec;if(!inB(xr,xc)||isRuin(xr,xc)||(xr===r&&xc===c))continue;
        const x=G.board[xr][xc];
        if(!x)add(xr,xc,'move');
        else if(x.t==='card'&&x.owner!==who)add(xr,xc,'attk');
        else if(x.t==='temple'&&x.owner!==who&&x.hp>0&&!(er===-fd&&ec===0))add(xr,xc,'attk');
      }
    }
    else if(t.t==='card'&&t.owner!==who)add(tr,tc,'attk');
    else if(t.t==='temple'&&t.owner!==who&&t.hp>0&&!(dr===-fd&&dc===0))add(tr,tc,'attk');
  }
  return[...res.values()];
}
function validRangedCells(r,c,who){
  const cell=G.board[r][c];if(!cell||cell.t!=='card'||!hK(cell.cd,'ranged'))return[];
  const fd=fwd(who),res=[];
  // en línea recta, sin límite de alcance, solo en las direcciones en que la carta puede moverse
  // (adelante siempre; costados con Flanquea; atrás con Retrocede): la 1ª carta rival, solo si puede matarla. No dispara a templos.
  const dirs=[[fd,0]];if(hK(cell.cd,'S'))dirs.push([0,-1],[0,1]);if(hK(cell.cd,'B'))dirs.push([-fd,0]);
  for(const[dr,dc]of dirs){
    for(let d=1;d<=6;d++){
      const tr=r+dr*d,tc=c+dc*d;if(!inB(tr,tc)||isRuin(tr,tc))break;
      const tgt=G.board[tr][tc];
      if(tgt){if(tgt.t==='card'&&tgt.owner!==who&&resolveRanged(cell,tgt)==='kill')res.push({r:tr,c:tc,vt:'ranged'});break;}
    }
  }
  return res;
}
function validDeployCells(who){
  const dr=deployRow(who),res=[];
  for(let c=0;c<3;c++){if(isRuin(dr,c))continue;const t=G.board[dr][c];if(!t)res.push({r:dr,c,vt:'move'});else if(t.t==='card'&&t.owner!==who)res.push({r:dr,c,vt:'deploy-combat'});}
  return res;
}
function playChargeSound(){SFX.charge();}
function resolveCombat(A,B){
  // Blast keyword: both die regardless of type
  if(hK(A.cd,'blast')||hK(B.cd,'blast'))return'blast';
  const ta=A.cd.type,tb=B.cd.type;
  const aWins=(TYPE_BEATS[ta]||[]).includes(tb);
  const bWins=(TYPE_BEATS[tb]||[]).includes(ta);
  if(aWins&&!bWins)return'A';
  if(bWins&&!aWins)return'B';
  return'tie'; // same type or mutual neutrality
}
// Ranged: same as melee but (a) blast ignored, (b) shooter never dies.
// If shooter's type beats target OR tie → target dies (kill). If target would win → noeffect.
function resolveRanged(shooter,target){
  const ts=shooter.cd.type,tt=target.cd.type;
  const targetWins=(TYPE_BEATS[tt]||[]).includes(ts)&&!(TYPE_BEATS[ts]||[]).includes(tt);
  return targetWins?'noeffect':'kill';
}
function previewCombat(A,B){const r=resolveCombat(A,B);return r==='A'?'win':r==='B'?'lose':r;}
function toDeck(ci){dc(gP(ci.owner)).push(ci);}
function checkWin(){
  for(const who of['p1','ai']){
    const enemy=opp(who);let sAlive=0,bAlive=0;
    for(let r=0;r<7;r++)for(let c=0;c<3;c++){const ce=G.board[r][c];if(ce&&ce.t==='temple'&&ce.owner===enemy){if(ce.sz==='s'&&ce.hp>0)sAlive++;if(ce.sz==='b'&&ce.hp>0)bAlive++;}}
    if(bAlive===0||sAlive===0){G.winner=who;G.phase='over';if(!G._sim)setTimeout(()=>who==='p1'?SFX.winGame():SFX.loseGame(),200);return;}
  }
}
function hitTemple(tr,tc,attacker){
  G._lastHit=G._repo?'pago':'ataque';
  const tpl=G.board[tr][tc];if(!tpl||tpl.t!=='temple')return;
  tpl.hp--;const own=gP(tpl.owner);
  fx({k:'burst',r:tr,c:tc,icon:'temple',tn:tpl.owner==='p1'?'lose':'win',at:0});fx({k:'float',r:tr,c:tc,text:'−1',tn:tpl.owner==='p1'?'lose':'win',at:120});fxSeq(500);
  const sz=tpl.sz==='b'?'Central':'Chico',mine=tpl.owner==='p1',ownerS=mine?'tuyo':'de la IA';
  if(G._repo){
    log('💥 '+(mine?'Pagás':'La IA paga')+' 1 vida del templo '+sz+' para reponer: '+(tpl.hp<=0?'<b>queda destruido</b>':'queda '+tpl.hp+'/'+tpl.maxHp)+'.');
    if(tpl.hp<=0)SFX.templeDestroy();else SFX.temple();
  }else{
    const by=attacker?cn(attacker)+' golpea':'Golpe a';
    log(tpl.hp<=0?'💥 ¡'+by+' el templo '+sz+' '+ownerS+' y lo <b>DESTRUYE</b>!':'💥 '+by+' el templo '+sz+' '+ownerS+': pierde 1 vida (queda '+tpl.hp+'/'+tpl.maxHp+').'+(attacker?' <b>'+attacker.cd.name+'</b> va al descarte.':''));
    if(tpl.hp<=0)SFX.templeDestroy();else SFX.temple();
  }
  if(tpl.hp<=0){G.board[tr][tc]=null;G.ruins.add(tr+','+tc);}
  own.actMax++;
  log('⚡ '+(mine?'Ganás':'La IA gana')+' +1 acción permanente: ahora '+(mine?'tenés':'tiene')+' '+own.actMax+' por turno.');
  if(attacker)toDeck(attacker);checkWin();
}
// Returns array of all valid combo targets in every direction this card can move
function findComboTargets(winner,wr,wc){
  if(!hK(winner.cd,'combo')||G.board[wr][wc]!==winner)return[];
  const fd=fwd(winner.owner);
  const dirs=[];
  if(hK(winner.cd,'F')||hK(winner.cd,'charge'))dirs.push([fd,0]);   // forward
  if(hK(winner.cd,'S'))dirs.push([0,-1],[0,1]);                     // sideways
  if(hK(winner.cd,'B'))dirs.push([-fd,0]);                          // backward
  const targets=[];
  for(const[dr,dc]of dirs){
    const nr=wr+dr,nc=wc+dc;
    if(!inB(nr,nc)||isRuin(nr,nc))continue;
    const next=G.board[nr][nc];if(!next)continue;
    if(next.t==='card'&&next.owner!==winner.owner){
      const prev=previewCombat(winner,next);
      targets.push({targetR:nr,targetC:nc,isTemple:false,dr,dc,preview:prev});
    }else if(next.t==='temple'&&next.owner!==winner.owner&&next.hp>0){
      targets.push({targetR:nr,targetC:nc,isTemple:true,dr,dc,preview:'temple'});
    }
  }
  return targets;
}
function executeCombo(winner,wr,wc,targetR,targetC,isTemple){
  const target=G.board[targetR][targetC];if(!target)return;
  const tname=isTemple?'el templo '+(target.sz==='b'?'Central':'Chico'):cn(target);
  log('🔥 <b>Combo</b>: '+cn(winner)+' sigue contra '+tname+'.');SFX.combo();
  if(isTemple){fxSeq(fxSlide(winner,wr,wc,targetR,targetC));G.board[wr][wc]=null;hitTemple(targetR,targetC,winner);log('🔥 El combo termina: golpear un templo lo cierra.');}
  else{
    const res=resolveCombat(winner,target);fxClash(res,winner,target,wr,wc,targetR,targetC);
    if(res==='A'){
      log('✅ Combo: '+cn(winner)+' eliminó a '+cn(target)+' ('+beatLine(winner.cd.type,target.cd.type)+'). <b>'+target.cd.name+'</b> va al descarte.');
      toDeck(target);
      G.board[targetR][targetC]=winner; // winner advances into target's cell
      G.board[wr][wc]=null;
    }
    else if(res==='B'){log('🛡️ Combo cortado: '+cn(target)+' resistió ('+beatLine(target.cd.type,winner.cd.type)+'). <b>'+winner.cd.name+'</b> va al descarte y el combo termina.');toDeck(winner);G.board[wr][wc]=null;}
    else if(res==='blast')log('💥 Combo cortado por el Blast de <b>'+blastNames(winner,target)+'</b>: '+cn(winner)+' y '+cn(target)+' van al descarte y el combo termina.');
    else log('💨 Combo cortado por empate (ambas de tipo '+TYPE_NAME[winner.cd.type]+'): van al descarte y el combo termina.');
    if(res==='blast'||res==='tie'){toDeck(winner);toDeck(target);G.board[wr][wc]=null;G.board[targetR][targetC]=null;}
  }
}
function applyMelee(mover,tgt,fr,fc,tr,tc){
  const res=resolveCombat(mover,tgt);fxClash(res,mover,tgt,fr,fc,tr,tc);
  if(res==='A'){log('⚔️ '+cn(mover)+' venció a '+cn(tgt)+': '+beatLine(mover.cd.type,tgt.cd.type)+'. <b>'+tgt.cd.name+'</b> va al descarte.');toDeck(tgt);G.board[tr][tc]=mover;if(fr>=0)G.board[fr][fc]=null;SFX.kill();return'win';}
  else if(res==='B'){log('🛡️ '+cn(tgt)+' resistió a '+cn(mover)+': '+beatLine(tgt.cd.type,mover.cd.type)+'. <b>'+mover.cd.name+'</b> va al descarte.');toDeck(mover);if(fr>=0)G.board[fr][fc]=null;SFX.kill();return'lose';}
  else{
    if(res==='blast')log('💥 Blast de <b>'+blastNames(mover,tgt)+'</b>: '+cn(mover)+' y '+cn(tgt)+' van al descarte (el Blast ignora los tipos).');
    else log('💨 Empate: ambas son de tipo '+TYPE_NAME[mover.cd.type]+'. <b>'+mover.cd.name+'</b> y <b>'+tgt.cd.name+'</b> van al descarte.');
    toDeck(mover);toDeck(tgt);if(fr>=0)G.board[fr][fc]=null;G.board[tr][tc]=null;if(res==='blast')SFX.blast();else SFX.tie();return'both';}
}
function doMove(fr,fc,tr,tc,who){
  who=who||G.cur;const mover=G.board[fr][fc];if(!mover)return'ok';

}
function doDeploy(handIdx,r,c,who){

function clickCell(r,c){
  if(G.phase==='over'||G.cur!=='p1'||G.aiThinking)return;
  if(G.confirm)return;

    if(ce&&ce.t==='temple'&&ce.owner==='p1'&&ce.hp>0){G.confirm={type:'repo',col:c};renderGame();}
    return;
  }

  if(G.comboPending){
    const tgtIdx=G.comboPending.targets.findIndex(t=>t.targetR===r&&t.targetC===c);
    if(tgtIdx>=0)playerComboYes(tgtIdx);

  }

    const vc=G.validCells.find(v=>v.r===r&&v.c===c);

      if(G.sel.from==='hand'){const res=doDeploy(G.sel.idx,r,c,'p1');if(res==='combo'){G.sel=null;G.rangedMode=false;renderGame();return;}consumeAction('p1');}

// Pesos de la elección de mazo de la IA (evolucionables con tools/evolve.js)
const AI_DECK={combo:2,charge:7,S:2,ranged:1,blast:1,B:1,noise:2.5};
function aiPickIds(w){
  // La IA arma su mazo con criterio propio, sin mirar qué eligió el jugador:
  // valora las skills, garantiza al menos 1 carta de cada tipo y agrega algo de azar para variar.
  w=w||AI_DECK;
  const kw=cd=>{let s=w['t_'+cd.type]||0;for(const k of['combo','charge','S','ranged','blast','B'])if(hK(cd,k))s+=w[k];return s;};
  const scored=CARDS.map(cd=>({cd,score:kw(cd)+Math.random()*w.noise})).sort((a,b)=>b.score-a.score);
  const picked=[];
  for(const tp of['water','fire','metal','plant','earth']){
    const best=scored.find(s=>s.cd.type===tp&&!picked.includes(s.cd.id));
    if(best)picked.push(best.cd.id);
  }
  for(const s of scored){if(picked.length>=8)break;if(!picked.includes(s.cd.id))picked.push(s.cd.id);}
  return picked.slice(0,8);
}

function getP1UpcomingTypes(peekDepth){
  // Full-state read of what's coming: current hand (always visible) + next N cards
  // in the deck queue (deterministic order once revealed — this IS the out-cycle read).
  const types=[];
  for(const ci of G.p1.hand)types.push(ci.cd.type);
  for(let i=0;i<Math.min(peekDepth||3,G.p1.deck.length);i++)types.push(G.p1.deck[i].cd.type);

}
function getCards(who){const r=[];for(let row=0;row<7;row++)for(let col=0;col<3;col++){const ce=G.board[row][col];if(ce&&ce.t==='card'&&ce.owner===who)r.push({ci:ce,r:row,c:col});}return r;}
function getTemples(who){const r=[];for(let row=0;row<7;row++)for(let col=0;col<3;col++){const ce=G.board[row][col];if(ce&&ce.t==='temple'&&ce.owner===who&&ce.hp>0)r.push({tpl:ce,r:row,c:col});}return r;}
function columnClear(r,c,who){
  const fd=fwd(who),enemy=opp(who);
  for(let d=1;d<=6;d++){const nr=r+fd*d;if(!inB(nr,c)||isRuin(nr,c))break;const ce=G.board[nr][c];if(!ce)continue;if(ce.t==='temple'&&ce.owner===enemy)return true;return false;}
  return false;
}
function aiEvalStrategy(){
  G.aiTurnNum++;
  const p1Cards=getCards('p1');

  // ── DEFEND: always overrides everything ──
  // 1. Immediate adjacency
  for(const{ci,r,c}of p1Cards){
    const ahead=r-1;
    if(ahead>=0&&G.board[ahead][c]&&G.board[ahead][c].t==='temple'&&G.board[ahead][c].owner==='ai'){
      G.aiStrat='DEFEND';G.aiStratLocked=false;
      return'Defensa urgente: rival adyacente a mi templo en '+pos(r,c);
    }
  }
  // 2. Clear-path threat ≤2 effective moves (charge halves distance)
  for(const{ci,r,c}of p1Cards){
    const aiTemple=G.board[0][c];
    if(!aiTemple||aiTemple.t!=='temple'||aiTemple.owner!=='ai'||aiTemple.hp<=0)continue;
    let blocked=false;
    for(let nr=r-1;nr>=1;nr--){const ce=G.board[nr][c];if(ce&&ce.t==='card'&&ce.owner==='ai'){blocked=true;break;}}
    if(blocked)continue;
    const movesNeeded=hK(ci.cd,'charge')?Math.ceil(r/2):r;
    if(movesNeeded<=2){
      G.aiStrat='DEFEND';G.aiStratLocked=false;
      return'Defensa preventiva: '+ci.cd.name+(hK(ci.cd,'charge')?'⚡':'')+' llega a mi templo C'+dC(c)+' en ~'+movesNeeded+' movs sin bloqueador';
    }
  }
  if(G.aiStrat==='DEFEND'){G.aiStratLocked=false;}

  // ── WINNING BLOW: lock in and finish ──
  const enemyTemples=getTemples('p1');
  const centralTpl=enemyTemples.find(t=>t.tpl.sz==='b');
  // Central at 1HP → override everything, lock CENTRAL, route ALL cards there
  if(centralTpl&&centralTpl.tpl.hp===1){
    G.aiStrat='CENTRAL';G.aiStratLocked=true;
    return'¡GOLPE FINAL al central! Bloqueado CENTRAL — todo a C2';
  }
  const smallTemples=enemyTemples.filter(t=>t.tpl.sz==='s');
  for(const{tpl,r,c}of smallTemples){
    if(tpl.hp===1){
      const otherAlive=smallTemples.filter(t=>t.c!==c&&t.tpl.hp>0).length;
      if(otherAlive===0){
        G.aiStrat='LATERAL';G.aiStratLocked=true;
        return'¡GOLPE FINAL al último chico C'+dC(c)+'! Bloqueado LATERAL';
      }
    }
  }

  // ── Strategy already locked: enforce it strictly ──
  if(G.aiStratLocked){
    return'Estrategia bloqueada: '+G.aiStrat+' (sin cambios)';
  }

  // ── First-turn strategy selection (or post-defend re-evaluation) ──
  const p1Bonus=G.p1.actMax-1;

  // If we already gave away 2+ actions from central, NEVER go central again
  if(p1Bonus>=2&&G.aiStrat==='CENTRAL'){
    G.aiStrat='LATERAL';G.aiStratLocked=true;
    return'Lateral bloqueado: ya di '+p1Bonus+' acciones extra al rival por el central, no insisto';
  }

  // Si ya empezaste una ruta, terminala
  const smallsHurt=smallTemples.filter(t=>t.tpl.hp<t.tpl.maxHp).length;
  if(smallsHurt>0){
    G.aiStrat='LATERAL';G.aiStratLocked=true;
    return'Lateral bloqueado: ya dañé '+smallsHurt+' templo(s) chico(s) — commitear la ruta';
  }
  // Si ya dañaste el central, no la abandonés
  if(centralTpl&&centralTpl.tpl.hp<centralTpl.tpl.maxHp){
    G.aiStrat='CENTRAL';G.aiStratLocked=true;
    return'Central bloqueado: ya dañé el central — commitear la ruta';
  }

  // Measure lateral column blockage vs central path
  let lateralScore=0,centralScore=0;
  function cardVal(ci){return 2+(hK(ci.cd,'combo')?3:0)+(hK(ci.cd,'charge')?2:0)+(hK(ci.cd,'ranged')?1:0);}
  // Central: do I have strong cards in col 1?
  const myCards=getCards('ai');
  for(const{ci,r,c}of myCards){
    if(c===1&&r>=2)centralScore+=cardVal(ci);
    if((c===0||c===2)&&r>=2)lateralScore+=cardVal(ci);
  }
  // Penalize central if it would empower rival
  centralScore-=p1Bonus*15;
  // Check column openness: any P1 card blocks a lateral column
  let col0blocked=false,col2blocked=false;
  for(let r=2;r<=5;r++){
    const ce0=G.board[r][0],ce2=G.board[r][2];
    if(ce0&&ce0.t==='card'&&ce0.owner==='p1')col0blocked=true;
    if(ce2&&ce2.t==='card'&&ce2.owner==='p1')col2blocked=true;
  }
  if(!col0blocked)lateralScore+=20;
  if(!col2blocked)lateralScore+=20;
  if(col0blocked&&col2blocked)centralScore+=15;

  // Out-cycle: does my hand answer well against what the rival is about to draw/play?
  const upcoming=getP1UpcomingTypes(3);
  if(upcoming.length){
    let handCounterScore=0;
    for(const ci of G.ai.hand){
      let adv=0;for(const t of upcoming){if((TYPE_BEATS[ci.cd.type]||[]).includes(t))adv++;if((TYPE_BEATS[t]||[]).includes(ci.cd.type))adv--;}
      handCounterScore+=adv;
    }
    if(handCounterScore>=2)centralScore+=10;      // well-armed: push the shorter, decisive route
    else if(handCounterScore<=-2)lateralScore+=10; // weak answers: hedge by splitting pressure
  }

  if(lateralScore>=centralScore){
    G.aiStrat='LATERAL';G.aiStratLocked=true;
    return'Lateral bloqueado: score lateral='+lateralScore+' vs central='+centralScore;
  }else{
    G.aiStrat='CENTRAL';G.aiStratLocked=true;
    return'Central bloqueado: score central='+centralScore+' vs lateral='+lateralScore;
  }
}
// Returns {col, urgency('CRITICAL'|'HIGH'|'MEDIUM'), movesNeeded, msg} for the most urgent threat,
// or null if no threat. Considers clear-path (no AI blocker) + card mobility.
function detectPlayerThreat(){
  const p1Cards=getCards('p1');
  const threats=[];
  for(const{ci,r,c}of p1Cards){
    // Only care about columns where I have a temple
    const aiTemple=G.board[0][c];
    if(!aiTemple||aiTemple.t!=='temple'||aiTemple.owner!=='ai'||aiTemple.hp<=0)continue;
    // Check if there's an AI blocker between this P1 card and row 0
    let blocked=false;
    for(let nr=r-1;nr>=1;nr--){
      const ce=G.board[nr][c];
      if(ce&&ce.t==='card'&&ce.owner==='ai'){blocked=true;break;}
    }
    if(blocked)continue;
    // Distance to temple (row 1 is adjacent to row 0 temple)
    const dist=r; // rows 1..6, temple is row 0
    // Effective moves needed
    const isCharge=hK(ci.cd,'charge');
    const movesNeeded=isCharge?Math.ceil(dist/2):dist;
    const urgency=movesNeeded<=1?'CRITICAL':movesNeeded<=2?'HIGH':'MEDIUM';
    if(movesNeeded<=4){
      threats.push({col:c,urgency,dist,movesNeeded,
        msg:'Rival '+ci.cd.name+(isCharge?'⚡':'')+' a '+dist+' casillas de mi templo C'+dC(c)+' (camino libre, ~'+movesNeeded+' movs)'});
    }
  }
  if(!threats.length)return null;
  // Return most urgent (fewest moves needed, prefer critical cols)
  threats.sort((a,b)=>a.movesNeeded-b.movesNeeded||(a.col===1?-1:1));
  return threats[0];
}
function aiScoreAction(action){
  let score=0;
  const strat=G.aiStrat;

  switch(action.type){
    case'attack_temple':{
      const tpl=G.board[action.tr][action.tc];if(!tpl)break;
      const isCentral=tpl.sz==='b';

      // ── Winning blow: always top priority regardless of strategy ──
      if(tpl.hp===1){
        if(isCentral){score+=300;break;}
        const otherSmall=getTemples('p1').filter(t=>t.tpl.sz==='s'&&t.c!==action.tc&&t.tpl.hp>0).length;
        if(otherSmall===0){score+=300;break;}
        // Not last small but hurts
        if(strat==='LATERAL')score+=100;
        else score+=20; // off-strategy partial hit
        break;
      }

      // ── Non-killing temple hits: disciplina estricta de estrategia ──
      if(isCentral){
        if(strat==='CENTRAL'){
          score+=60;
          if(tpl.hp===2)score+=20; // siguiente hit gana
          // Penalizar si ya le dimos demasiadas acciones al rival
          score-=G.p1.actMax*12;
          if(G.p1.actMax>=3)score-=40;
        }else{
          // OFF-STRATEGY: golpear el central jugando LATERAL = regalarle acciones al rival sin avanzar
          score-=180;
        }
      }else{
        // Small temple
        if(strat==='LATERAL'){
          // Golpe parcial: solo vale si tenemos follow-up en esa columna
          const myCardsInCol=getCards('ai').filter(({c})=>c===action.tc).length;
          score+=60+myCardsInCol*15;
          // Penalizar por la acción extra que le damos al rival
          score-=G.p1.actMax*10;
          // Sin follow-up garantizado, golpe parcial es riesgoso
          if(myCardsInCol===0)score-=60;
          else if(myCardsInCol===1&&tpl.hp>1)score-=40;
        }else if(strat==='CENTRAL'){
          // OFF-STRATEGY: golpear chicos jugando CENTRAL = mezclar rutas = darle acciones gratis
          score-=180;
        }else{
          score+=30; // DEFEND: cualquier daño es ok
        }
      }
      break;
    }
    case'attack':{
      const tgt=G.board[action.tr][action.tc],atk=G.board[action.fr][action.fc];if(!tgt||!atk)break;
      if(action.result==='win'){
        score+=40;
        if(columnClear(action.tr,action.tc,'ai'))score+=50;
        // Combo chain into temple?
        if(hK(atk.cd,'combo')){const cts=findComboTargets(atk,action.tr,action.tc);if(cts&&cts.length){score+=cts.find(ct=>ct.isTemple)?80:28;}}
        // On-strategy column bonus
        const onStratCol=(strat==='CENTRAL'&&action.tc===1)||(strat==='LATERAL'&&action.tc!==1)||(strat==='DEFEND');
        if(onStratCol)score+=25;else score-=10; // fuera de ruta pero al menos reduce presión
        // Removing dangerous cards (combo/charge = high threat)
        if(hK(tgt.cd,'combo')||hK(tgt.cd,'charge'))score+=20;
        // Clearing path: check if 1-2 rows away from enemy temple after kill
        const fd=fwd('ai');
        for(let d=1;d<=3;d++){const nr=action.tr+fd*d;if(!inB(nr,action.tc)||isRuin(nr,action.tc))break;const ne=G.board[nr][action.tc];if(ne&&ne.t==='temple'&&ne.owner==='p1'){score+=30*(4-d);break;}if(ne&&ne.t==='card')break;}
      }else if(action.result==='blast'){
        score+=30; // blast always kills regardless of type
        if(columnClear(action.tr,action.tc,'ai'))score+=30;
      }else if(action.result==='lose'){
        score-=40;
        if(hK(atk.cd,'combo')||hK(atk.cd,'charge'))score-=15; // extra caution with valuable cards
        // Only acceptable in DEFEND to block temple threat
        if(strat==='DEFEND')score+=25;
      }else score+=4;
      break;
    }
    case'ranged':{
      if(action.effective){
        score+=62;
        if(columnClear(action.tr,action.tc,'ai'))score+=38;
        const tgt=G.board[action.tr][action.tc];
        if(tgt){
          if(hK(tgt.cd,'combo')||hK(tgt.cd,'charge'))score+=20; // dangerous cards worth eliminating
          const onStratCol=(strat==='CENTRAL'&&action.tc===1)||(strat==='LATERAL'&&action.tc!==1);
          if(onStratCol)score+=20;else score-=5;
        }
      }else score-=15; // Don't waste action on ineffective ranged
      break;
    }
    case'move':{
      const mover=G.board[action.fr][action.fc];if(!mover)break;
      const fd=fwd('ai'),isForward=(action.tr-action.fr)*fd>0;
      const onStratCol=(strat==='CENTRAL'&&action.tc===1)||(strat==='LATERAL'&&action.tc!==1)||(strat==='DEFEND');
      score+=isForward?8:1;
      if(onStratCol)score+=15;else score-=8;  // off-strategy move: nudge, not wall
      // Don't advance into losing combat
      const nextR=action.tr+fd;
      if(inB(nextR,action.tc)){
        const ahead=G.board[nextR][action.tc];
        if(ahead&&ahead.t==='card'&&ahead.owner==='p1'){
          const prev=previewCombat(mover,ahead);
          if(prev==='lose'){score-=25;if(hK(mover.cd,'combo')||hK(mover.cd,'charge'))score-=15;}
          else if(prev==='win')score+=18;
          else if(prev==='blast')score+=8; // blast clears path
        }
        if(ahead&&ahead.t==='temple'&&ahead.owner==='p1'){
          // One move away from attacking temple
          if(strat==='LATERAL'&&(action.tc===0||action.tc===2))score+=35;
          if(strat==='CENTRAL'&&action.tc===1)score+=35;
        }
      }
      // Two moves away from temple
      const twoR=action.tr+fd*2;
      if(inB(twoR,action.tc)&&!G.board[nextR]?.[action.tc]){
        const two=G.board[twoR][action.tc];
        if(two&&two.t==='temple'&&two.owner==='p1')score+=20;
      }
      break;
    }
    case'deploy':case'deploy_combat':{
      const ci=G.ai.hand[action.handIdx];if(!ci)break;
      score+=10;
      // Counter-type: reward deploying cards that beat enemy types on the board
      for(const{ci:ec,r:er}of getCards('p1')){
        const dist=Math.abs(er-(action.tr));
        if(dist<=3){
          if((TYPE_BEATS[ci.cd.type]||[]).includes(ec.cd.type))score+=22-dist*3;
          else if((TYPE_BEATS[ec.cd.type]||[]).includes(ci.cd.type))score-=18;
        }
      }
      // Out-cycle: bias toward countering what's coming next (hand + next draws), not just the board
      {
        const upcoming=getP1UpcomingTypes(3);
        if(upcoming.length){
          let futBeats=0,futLoses=0;
          for(const t of upcoming){
            if((TYPE_BEATS[ci.cd.type]||[]).includes(t))futBeats++;
            if((TYPE_BEATS[t]||[]).includes(ci.cd.type))futLoses++;
          }
          score+=(futBeats-futLoses)*6;
        }
      }
      // Column alignment
      const onStratCol=(strat==='CENTRAL'&&action.tc===1)||(strat==='LATERAL'&&action.tc!==1)||(strat==='DEFEND');
      if(onStratCol)score+=18;else score-=10;
      if(action.type==='deploy_combat'){
        const tgt=G.board[action.tr][action.tc];
        if(action.result==='win'){
          score+=35;
          if(columnClear(action.tr,action.tc,'ai'))score+=30;
          if(hK(ci.cd,'combo'))score+=18;
        }else if(action.result==='lose')score-=28;
        else if(action.result==='blast')score+=28; // blast always worth it — clears any type
      }
      // Special card bonuses
      if(hK(ci.cd,'ranged'))score+=14;
      if(hK(ci.cd,'charge'))score+=10;
      if(strat==='DEFEND'){
        const threatened=getCards('p1').filter(({r})=>r<=3).map(({c})=>c);
        if(threatened.includes(action.tc))score+=40;
      }
      break;
    }
    case'end_turn':score=-80;break;
  }
  return Math.round(score);
}
function actionWinsGame(action){

function generateAIActions(){

    for(const v of validMoveCells(r,c,'ai')){const tgt=G.board[v.r][v.c];if(v.vt==='move')actions.push({type:'move',fr:r,fc:c,tr:v.r,tc:v.c});else if(v.vt==='attk'){if(tgt&&tgt.t==='temple')actions.push({type:'attack_temple',fr:r,fc:c,tr:v.r,tc:v.c});else if(tgt&&tgt.t==='card')actions.push({type:'attack',fr:r,fc:c,tr:v.r,tc:v.c,result:previewCombat(cell,tgt)});}}

}
function shouldAICombo(winner,wr,wc,ct){

  const next=G.board[ct.targetR][ct.targetC];if(!next)return false;

}
function aiCheckCombo(wr,wc,who){
  who=who||'ai';

  if(!winner||winner.t!=='card'||winner.owner!==who||!hK(winner.cd,'combo'))return;
  const cts=findComboTargets(winner,wr,wc);
  if(!cts.length){comboNoTargets(winner);return;}

  const best=cts.find(ct=>ct.isTemple)||cts.find(ct=>ct.preview==='win')||cts.find(ct=>ct.preview==='blast');
  if(best&&shouldAICombo(winner,wr,wc,best)){

  }
}
function aiExecuteAction(action){

// Explora secuencias de acciones del turno (beam search) sobre copias del estado y

const AI2={beam:12,depth:4,actVal:43,card:2,hand:0.3,adv:7.8,lane:14.6,deployRisk:0.3,tpScale:1500,budgetMs:400,cycle:3,explore:0.1,exploreTol:80};
function simGet(){return{board:G.board,ruins:G.ruins,p1:G.p1,ai:G.ai,cur:G.cur,winner:G.winner,phase:G.phase};}
function simSet(s){G.board=s.board;G.ruins=s.ruins;G.p1=s.p1;G.ai=s.ai;G.cur=s.cur;G.winner=s.winner;G.phase=s.phase;}
function simClone(s){
  const cp=p=>({hand:p.hand.slice(),deck:p.deck.slice(),discard:(p.discard||[]).slice(),actLeft:p.actLeft,actMax:p.actMax});
  return{board:s.board.map(row=>row.map(c=>c&&c.t==='temple'?{...c}:c)),ruins:new Set(s.ruins),p1:cp(s.p1),ai:cp(s.ai),cur:s.cur,winner:s.winner,phase:s.phase};
}
function simWith(state,fn){
  const saved=simGet(),was=G._sim,cpend=G.comboPending;
  G._sim=true;G.comboPending=null;simSet(state);
  try{return fn();}finally{simSet(saved);G._sim=was;G.comboPending=cpend;}
}
function applyAction(who,a){
  G.comboPending=null;
  switch(a.type){
    case'move':case'attack':case'attack_temple':const mr=doMove(a.fr,a.fc,a.tr,a.tc,who);G.comboPending=null;if(G.phase!=='over'&&mr==='win')aiCheckCombo(a.tr,a.tc,who);break;
    case'ranged':doRanged(a.fr,a.fc,a.tr,a.tc);break;
    case'repo':payLife(who,a.col);break;
    case'deploy':case'deploy_combat':{
      const dr=doDeploy(a.handIdx,a.tr,a.tc,who);G.comboPending=null;
      if(G.phase!=='over'&&dr==='win')aiCheckCombo(a.tr,a.tc,who);break;}
  }
  
}
function simApply(state,who,a){
  const n=simClone(state);

}
function simEndTurn(state,who){

}
function genActions(state,who,noDeploy){

      }
      for(const v of validRangedCells(r,c,who)){const tgt=G.board[v.r][v.c];acts.push({type:'ranged',fr:r,fc:c,tr:v.r,tc:v.c,temple:!!v.temple,effective:!!v.temple||!!(tgt&&resolveRanged(cell,tgt)==='kill')});}
    }

        const base={type:combat?'deploy_combat':'deploy',handIdx:i,tr:d.r,tc:d.c,result:combat&&tgt?previewCombat(ci,tgt):null};
        acts.push(base);

}

      for(let k=1;k<=6;k++){const nr=r+fd*k;if(nr<0||nr>6||s.ruins.has(nr+','+c))break;const x=s.board[nr][c];if(!x)continue;if(x.t==='temple'&&x.owner===enemy&&x.hp>0){clear=true;d=k;}break;}
      if(clear){const eff=hK(ce.cd,'charge')?Math.ceil(d/2):d;v+=AI2.lane/eff;}

function gP2(s,who){return who==='p1'?s.p1:s.ai;}
function oppReply(state,me){
  const o=opp(me);let s=simEndTurn(state,me);
  const n=s[o].actLeft;
  for(let i=0;i<n&&!s.winner;i++){
    let bestS=null,bestV=evalState(s,o);
    for(const a of genActions(s,o,true)){
      if(a.type==='end_turn')continue;
      const s2=simApply(s,o,a),v=evalState(s2,o);

function aiSearchBest(who){
  const t0=Date.now();
  const root=simClone(simGet());
  const depth=Math.max(1,Math.min(gP(who).actLeft,AI2.depth));
  let frontier=[{s:root,first:null,ev:evalState(root,who)}];
  const leaves=[];
  for(let d=0;d<depth;d++){
    if(d>0&&Date.now()-t0>AI2.budgetMs)break;
    const cand=[];
    for(const nd of frontier){
      for(const a of genActions(nd.s,who)){
        if(a.type==='end_turn'){leaves.push({s:nd.s,first:nd.first||a,ev:nd.ev,ended:true});continue;}
        const s2=simApply(nd.s,who,a),ev=evalState(s2,who);
        const node={s:s2,first:nd.first||a,ev:ev};
        if(s2.winner)leaves.push(node);else cand.push(node);
      }
    }
    cand.sort((x,y)=>y.ev-x.ev);
    frontier=cand.slice(0,AI2.beam);
  }
  for(const nd of frontier)leaves.push(nd);
  leaves.sort((x,y)=>y.ev-x.ev);
  let best=null,bestV=-Infinity;
  const top=leaves.slice(0,AI2.beam*2),scored=[];
  for(const lf of top){
    const full=lf.ended||lf.s.winner||gP2(lf.s,who).actLeft<=0;
    let v=lf.s.winner?lf.ev:(full?oppReply(lf.s,who):lf.ev);
    v+=Math.random()*0.5;
    if(Date.now()-t0>600&&best)break;
    if(lf.first)scored.push({v,first:lf.first});
    if(v>bestV){bestV=v;best=lf;}
  }
  // variación dentro de la personalidad: a veces elige la 2.ª o 3.ª mejor jugada distinta si no es mucho peor
  if(AI2.explore>0&&Math.random()<AI2.explore&&scored.length>1){
    const seen=new Set(),alts=[];scored.sort((a,b)=>b.v-a.v);
    for(const c of scored){const k=JSON.stringify(c.first);if(seen.has(k))continue;seen.add(k);alts.push(c);}
    // con AI2.second solo se considera la 2.ª mejor jugada (coherente, dentro de la tolerancia); si no, la 2.ª o 3.ª
    const ok=alts.slice(1,AI2.second?2:3).filter(c=>c.v>=alts[0].v-AI2.exploreTol);
    if(ok.length)return ok[Math.floor(Math.random()*ok.length)].first;
  }
  return best&&best.first?best.first:{type:'end_turn'};
}

const AI_TIMEOUT_MS=12000;

}
function aiStartCountdown(){

  _aiCountdownInterval=setInterval(()=>{
    if(!G.aiThinking){clearInterval(_aiCountdownInterval);_aiCountdownInterval=null;return;}
    const rem=Math.ceil((G._aiDeadline-Date.now())/1000);
    const el=document.getElementById('ai-countdown');if(el)el.textContent=rem+'s';
    if(rem<=0){clearInterval(_aiCountdownInterval);_aiCountdownInterval=null;aiForceEnd('timeout');}
  },250);
}
function aiEndTurn(){

  G._aiDeadline=null;G._aiLoopCount=0;
  G.aiThinking=false;drawCards('ai');G.cur='p1';G.p1.actLeft=G.p1.actMax;
  G.sel=null;G.validCells=[];G.rangedMode=false;G.comboPending=null;
  log('── <b>Tu turno</b> ──');renderGame();
}
async function aiTurn(){
  if(G.phase==='over'){G.aiThinking=false;renderGame();return;}
  if(!G.aiThinking){return;} // guard: don't run if turn was already ended externally
  if(G.ai.actLeft<=0){aiEndTurn();return;}

  // Wall-clock timeout guard
  if(G._aiDeadline&&Date.now()>G._aiDeadline){aiForceEnd('timeout');return;}

  // Loop-count guard (secondary)
  G._aiLoopCount=(G._aiLoopCount||0)+1;
  if(G._aiLoopCount===1&&G.aiMode!=='legacy')aiMood();
  if(G._aiLoopCount>30){aiForceEnd('loop limit');return;}

  let stratReason,threat,actions,scored,best;
  try{
    const legacy=G.aiMode==='legacy';
    if(legacy){stratReason=aiEvalStrategy();threat=detectPlayerThreat();}else{stratReason='búsqueda';threat=null;}
    actions=generateAIActions();
    if(!actions||!actions.length){log('⚠️ IA: generateAIActions devolvió vacío','ai-logic');aiEndTurn();return;}
    if(!legacy){best={action:aiSearchBest('ai'),score:0};}else{

    function effectiveScore(a){
      let s=aiScoreAction(a);
      if(!threat)return s;
      const col=threat.col;
      const urgBonus=threat.urgency==='CRITICAL'?200:threat.urgency==='HIGH'?120:60;
      if((a.type==='deploy'||a.type==='deploy_combat')&&a.tc===col){
        const ci=G.ai.hand[a.handIdx];
        if(ci){s+=urgBonus;if(a.result==='lose')s-=40;}
      }
      if(a.type==='move'&&a.tc===col){
        const p1InCol=getCards('p1').filter(x=>x.c===col);
        if(p1InCol.length){const closestP1=p1InCol.reduce((best,x)=>x.r<best.r?x:best,p1InCol[0]);if(a.tr>0&&a.tr<closestP1.r)s+=urgBonus;}
      }
      if((a.type==='attack'||a.type==='ranged')&&a.tc===col&&a.result!=='lose')s+=urgBonus;
      if(threat.urgency==='CRITICAL'&&a.tc!==col&&a.type==='move')s-=40;
      return s;
    }

    scored=actions.map(a=>({action:a,score:effectiveScore(a)}));
    best=scored.find(s=>actionWinsGame(s.action));
    if(!best){
      const nonEnd=scored.filter(s=>s.action.type!=='end_turn');
      if(nonEnd.length){
        let candidate=nonEnd.reduce((a,b)=>b.score>a.score?b:a);
        if(candidate.score<=-40){
          const stratCol=G.aiStrat==='CENTRAL'?[1]:[0,2];
          const desperate=nonEnd.filter(s=>
            (s.action.type==='attack'||s.action.type==='deploy_combat'||s.action.type==='move')
            &&stratCol.includes(s.action.tc||s.action.fc));
          if(desperate.length){
            // Among "lose" sacrifices, prefer losing the LEAST valuable card (protect combo/charge cards)
            function sacVal(s){const a=s.action;const mv=a.fr!=null?G.board[a.fr]&&G.board[a.fr][a.fc]:null;if(!mv)return 0;return(hK(mv.cd,'combo')?3:0)+(hK(mv.cd,'charge')?2:0)+(hK(mv.cd,'ranged')?1:0);}
            const losers=desperate.filter(s=>s.action.result==='lose');
            const sac=desperate.find(s=>s.action.result==='win')||
                       desperate.find(s=>s.action.result==='blast')||
                       (losers.length?losers.reduce((a,b)=>sacVal(b)<sacVal(a)?b:a):null)||
                       desperate.reduce((a,b)=>b.score>a.score?b:a);
            log('⚡ IA sacrifica en '+pos(sac.action.tr!=null?sac.action.tr:sac.action.fr, sac.action.tc!=null?sac.action.tc:sac.action.fc)+'.','ai-logic');
            candidate=sac;
          }
        }
        best=candidate;
      }else{
        best=scored[scored.length-1];
      }
    }
    }
  }catch(e){
    console.error('AI scoring error:',e);
    const ctx=`REC:${G._aiLoopCount||0} actLeft:${G.ai.actLeft} board:${JSON.stringify(G.board?.map(r=>r?.map(c=>c?c.t[0]+(c.owner==='ai'?'A':'P'):'·')))}`;
    log(`❌ IA error — ${e.constructor.name}: ${e.message} | Loop#${G._aiLoopCount||0} | ${ctx.slice(0,120)}`,'ai-error');
    log(`   Stack: ${(e.stack||'').split('\n').slice(0,3).join(' ← ')}`,'ai-error');
    aiForceEnd('error');return;
  }

  // Verify best is valid
  if(!best||!best.action){aiEndTurn();return;}

  const threatNote=threat?' ⚠️ '+threat.msg:'';
  log('🧠 '+buildAIReason(best.action,best.score,stratReason+threatNote).replace(/\s*Score:-?\d+\.?/,''),'ai-logic');
  ghRecord('IA',best.action.type,buildAIReason(best.action,best.score,'').replace('['+G.aiStrat+'] ',''));

  // ── Highlight src→tgt before executing ──
  {
    const a=best.action;
    const hl={fr:a.fr,fc:a.fc,tr:a.tr!=null?a.tr:a.fr,tc:a.tc!=null?a.tc:a.fc};
    G._aiHL=(hl.tr!=null&&hl.tc!=null)?hl:null;
    renderGame();if(G._aiHL)aimFx(hl);
    await sleep(hl.tr!=null?420:250);
    G._aiHL=null;
  }
  if(G.phase==='over'){G.aiThinking=false;renderGame();return;}
  if(!G.aiThinking){return;}

  try{aiExecuteAction(best.action);}catch(e){
    console.error('AI execute error:',e);
    log(`❌ IA execute error — ${e.constructor.name}: ${e.message} | action:${JSON.stringify(best.action)}`,'ai-error');
    log(`   Stack: ${(e.stack||'').split('\n').slice(0,3).join(' ← ')}`,'ai-error');
    aiForceEnd('error');return;
  }
  checkWin();
  if(G.phase==='over'){G.aiThinking=false;renderGame();return;}
  if(best.action.type!=='end_turn')G.ai.actLeft--;
  renderGame();const fxw=G._fxEnd||0;
  if(G.ai.actLeft>0&&best.action.type!=='end_turn'){
    await sleep(Math.max(360,fxw+120));
    if(G.aiThinking)await aiTurn();
  }else{await sleep(Math.max(180,fxw+120));aiEndTurn();}
}

function mkBar(who){

      const rngT=selCard&&hK(selCard.cd,'ranged')?validRangedCells(G.sel.r,G.sel.c,'p1'):[];
      c1.appendChild(rngT.length?g2Btn('ranged','Disparo',()=>toggleRangedMode(),false,'violet'+(G.rangedMode?' on':'')):g2Btn('close','Cancelar',()=>clearSel()));
    }
    else {const noCards=!G.p1.hand.length&&!G.board.some(r=>r.some(c=>c&&c.t==='card'&&c.owner==='p1'));
      c1.appendChild(g2Btn('refresh','Reponer',()=>startRepo(),!mine||!dc(G.p1).length,mine&&noCards&&dc(G.p1).length?'primary repo-hot':''));}
    const mb=g2Btn('more','Menú',()=>toggleMenu());c2.appendChild(mb);
    if(G._menu){
      const m=el('div','menu');
      const it=(icn,label,fn)=>{const b=el('button','menu-item');b.innerHTML=ic(icn)+label;b.onclick=()=>{G._menu=false;fn();};return b;};
      m.appendChild(it('help','Reglas y tutorial',()=>{renderGame();openRules();}));
      m.appendChild(it('list','Registro',()=>toggleLog()));
