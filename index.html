function getSelCard(){if(G.sel&&G.sel.from==='board')return G.board[G.sel.r]&&G.board[G.sel.r][G.sel.c]||null;if(G.sel&&G.sel.from==='hand')return G.p1.hand[G.sel.idx]||null;return null;}
function mkCell(r,c){
  const content=G.board[r][c];
  const isSel=G.sel&&G.sel.from==='board'&&G.sel.r===r&&G.sel.c===c;
  const vc=G.validCells.find(v=>v.r===r&&v.c===c),ruin=isRuin(r,c);
  const comboTgt=G.comboPending&&G.comboPending.targets?G.comboPending.targets.find(t=>t.targetR===r&&t.targetC===c):null;
  const isComboTgt=!!comboTgt,dies=isComboTgt&&comboTgt.preview==='lose';
  const key=r+','+c;
  let cls='cell',inner='',extra='';
  if(ruin){cls+=' is-ruin';inner='<div class="ruin">'+ic('ruin')+'</div>';}
  else if(content){
    if(content.t==='temple'){
      const big=content.sz==='b';cls+=' temple o-'+content.owner;
      _curHp[key]=content.hp;if(_prevHp[key]!=null&&content.hp<_prevHp[key])cls+=' hit';
      let pips='';for(let i=0;i<content.maxHp;i++)pips+='<span class="pip'+(i<content.hp?' on':'')+'"></span>';
      inner='<div class="tpl'+(big?' big':'')+'" data-fk="tp.'+r+'.'+c+'" data-fv="'+content.hp+'">'+ic(big?'tower':'temple')+'<div class="pips">'+pips+'</div></div>';
    }else{
      cls+=' c-'+content.owner+' t-'+content.cd.type;
      _curPos[content.inst]=key;if(_prevPos[content.inst]===undefined)cls+=' enter';
      inner=cardHTML(content.cd,'cell',content.owner==='ai');
    }
  }
  if(isSel)cls+=' sel-cell';
  if(G.phase==='over'&&_endKeys.has(key))cls+=' end-key';
  if(G.mode==='repo'&&content&&content.t==='temple'&&content.owner==='p1'&&content.hp>0)cls+=' v-repo clickable';
  if(isComboTgt)cls+=(dies?' vcombo-lose':' vcombo')+' clickable';
  else if(vc){if(vc.vt==='move')cls+=' vmove';else if(vc.vt==='attk')cls+=content&&content.t==='temple'?' vattk-temple':' vattk';else if(vc.vt==='deploy-combat')cls+=' vattk';else if(vc.vt==='ranged')cls+=' vranged';cls+=' clickable';}
  else if(!ruin&&content&&content.t==='card'&&content.owner==='p1'&&G.cur==='p1'&&!G.aiThinking&&!G.comboPending)cls+=' clickable';
  if(G._aiHL){
    if(G._aiHL.fr===r&&G._aiHL.fc===c)cls+=' ai-hl-src';
    if(G._aiHL.tr===r&&G._aiHL.tc===c)cls+=' ai-hl-tgt';
  }
  const cell=el('div',cls);cell.innerHTML=inner+extra;
  // Combat preview for normal attack cells
  if(!isComboTgt&&vc&&(vc.vt==='attk'||vc.vt==='ranged'||vc.vt==='deploy-combat')&&content&&content.t==='card'){
    const attacker=getSelCard();
    if(attacker){
      const isRng=vc.vt==='ranged';let prev;
      if(isRng){prev=resolveRanged(attacker,content)==='kill'?'win':'noeffect';}else prev=previewCombat(attacker,content);
      const k=prev==='win'?(isRng?'ranged':'check'):prev==='lose'?'x':prev==='blast'?'blast':prev==='tie'?'tie':'ban';
      const cb=el('div','badge '+(prev==='win'?'win':prev==='lose'?'lose':prev==='blast'?'blast':'none'));cb.innerHTML=ic(k);cell.appendChild(cb);
    }
  }
  // Combo target: direction chip + preview badge
  if(isComboTgt){
    const dirIc=comboTgt.dc===0?(comboTgt.dr===fwd(G.comboPending.winner.owner)?'F':'B'):(comboTgt.dc<0?'left':'right');
    const dc=el('div','dir-chip');dc.innerHTML=ic(dirIc);cell.appendChild(dc);
    const k=comboTgt.isTemple?'temple':comboTgt.preview==='win'?'check':dies?'x':comboTgt.preview==='blast'?'blast':'tie';
    const cb=el('div','badge '+(comboTgt.isTemple||comboTgt.preview==='win'?'win':dies?'lose':comboTgt.preview==='blast'?'blast':'none'));cb.innerHTML=ic(k);cell.appendChild(cb);
  }
  // AI flash overlay (blast / tie)
  if(G._aiFlash&&G._aiFlash.cells.some(f=>f.r===r&&f.c===c)){
    const isBlast=String(G._aiFlash.emoji).codePointAt(0)===0x1F4A3;
    const fo=el('div','ai-flash-overlay'+(isBlast?' blast':''));fo.innerHTML=ic(isBlast?'blast':'tie');cell.appendChild(fo);
  }
  cell.addEventListener('click',()=>{
    if(isComboTgt&&G.comboPending){const idx=G.comboPending.targets.findIndex(t=>t.targetR===r&&t.targetC===c);if(idx>=0)playerComboYes(idx);}
    else clickCell(r,c);
  });
  return cell;
}

function toggleLog(){G._showLog=!G._showLog;if(G._showLog)ttHide();renderGame();}
function mkLog(){
  const w=el('div','log'+(G._showLog?' sheet':''));
  const head=el('div','log-head');
  const cl=el('button','btn icon sm');cl.innerHTML=ic('copy');cl.setAttribute('aria-label','Copiar registro');
  cl.onclick=()=>{
    const txt=G.log.slice().reverse().map(e=>e.msg.replace(/<[^>]+>/g,'')).join('\n');
    const ok=()=>{cl.innerHTML=ic('check');setTimeout(()=>{cl.innerHTML=ic('copy');},1500);};
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(ok).catch(()=>{_copyFallback(txt);ok();});
      else{_copyFallback(txt);ok();}
    }catch(e){_copyFallback(txt);ok();}
  };
  head.innerHTML='<span class="grow">Registro</span>';head.appendChild(cl);
  const cx=el('button','btn icon sm log-close');cx.innerHTML=ic('close');cx.setAttribute('aria-label','Cerrar');cx.onclick=()=>toggleLog();head.appendChild(cx);w.appendChild(head);
  const body=el('div','log-body');
  // G.log is newest-first; AI reasoning/debug entries stay in the log but are not shown to the player
  body.innerHTML=G.log.filter(e=>e.type!=='ai-logic'&&e.type!=='ai-error').slice(0,40)
    .map(e=>'<div class="log-entry'+(e.msg.indexOf('──')===0?' sep':'')+'">'+fmtLog(e.msg).replace(/^─+\s*|\s*─+$/g,'')+'</div>').join('');
  body.addEventListener('mousedown',e=>e.stopPropagation());
  body.addEventListener('click',e=>e.stopPropagation());
  w.appendChild(body);return w;
}

  txt+='Acciones P1 al final: '+G.p1.actMax+' | IA al final: '+G.ai.actMax+'\n';
  txt+='══ LOG COMPLETO ══\n';
  const allLog=[...G.log].reverse();
  txt+=allLog.map(e=>'  '+e.msg.replace(/<[^>]+>/g,'')).join('\n')+'\n';

function _copyFallback(txt){
  const ta=document.createElement('textarea');ta.value=txt;
  ta.style.cssText='position:fixed;top:10px;left:10px;width:90vw;height:60vh;z-index:9999;font-size:11px;font-family:monospace';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');}catch(e){}
  setTimeout(()=>{if(ta.parentNode)document.body.removeChild(ta);},3000);
}
function copyHistory(){
  const txt=buildFullHistory();
  const b=document.getElementById('btn-copy-hist');

buildSortBar();buildDiffSeg();document.getElementById('btn-auto1').innerHTML=ic('refresh')+'<span class="lbl">Auto</span>';document.getElementById('btn-clear1').innerHTML=ic('trash');buildSelGrid();

// ════ TOOLTIPS (hover en desktop, mantener apretado en mobile) ════
const TT=document.createElement('div');TT.id='tt';document.body.appendChild(TT);
let _ttTimer=null,_lpFired=0;
function toastMs(html){return Math.min(9000,Math.max(3500,1800+html.replace(/<[^>]+>/g,'').length*45));}
function ttShow(t,hold){
  const h=t.getAttribute('data-tip');if(!h)return;
  if(G._showLog||document.querySelector('.modal.open,.over'))return;   // nada de tooltips encima del registro, los modales ni el cartel final
  TT.innerHTML=h;TT.classList.add('on');TT.style.transform='';TT.style.opacity='';
  const r=t.getBoundingClientRect(),w=TT.offsetWidth,hh=TT.offsetHeight;
  let x=Math.min(Math.max(8,r.left+r.width/2-w/2),window.innerWidth-w-8);
  let y=r.top-hh-8;if(y<8)y=Math.min(r.bottom+8,window.innerHeight-hh-8);
  TT.style.left=x+'px';TT.style.top=y+'px';
  clearTimeout(TT._timer);
  if(!hold)TT._timer=setTimeout(ttHide,toastMs(h));   // seguro por si el elemento desaparece
}
TT._pause=()=>clearTimeout(TT._timer);
TT._rearm=ms=>{clearTimeout(TT._timer);TT._timer=setTimeout(ttHide,ms);};
TT._dismiss=(fast,dir)=>{
  clearTimeout(TT._timer);TT._offAt=Date.now();
  if(dir){TT.style.transform='translateX('+(dir*110)+'%)';TT.style.opacity='0';setTimeout(ttHide,230);}else ttHide();
};
function attachSwipe(t){
  let x0=null,dx=0,moved=false,t0=0;
  const rearm=ms=>t._rearm(ms);
  // mantener apretado (o el mouse encima) pausa el cierre para poder leerlo
  t.addEventListener('pointerdown',e=>{x0=e.clientX;dx=0;moved=false;t0=Date.now();t._pause();try{t.setPointerCapture(e.pointerId);}catch(_){}t.style.transition='none';});
  t.addEventListener('pointermove',e=>{if(x0===null)return;dx=e.clientX-x0;if(Math.abs(dx)>6)moved=true;t.style.transform='translateX('+dx+'px)';t.style.opacity=String(Math.max(.25,1-Math.abs(dx)/220));});
  const end=()=>{
    if(x0===null)return;const d=dx,held=Date.now()-t0;x0=null;t.style.transition='';
    if(Math.abs(d)>60)t._dismiss(false,d>0?1:-1);
    else if(!moved&&held<350)t._dismiss();              // toque corto: cerrar
    else{t.style.transform='';t.style.opacity='';rearm(3500);} // mantenido: queda abierto un rato más
  };
  t.addEventListener('pointerup',end);t.addEventListener('pointercancel',end);
  t.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')t._pause();});
  t.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'&&x0===null&&!t._gone)rearm(2500);});
}
function ttHide(){TT.classList.remove('on');TT.style.transform='';TT.style.opacity='';}
attachSwipe(TT);
const tipOf=e=>e.target.closest&&e.target.closest('[data-tip]');
// mouse: queda abierto mientras estés encima (de la carta o del cuadro) y se cierra solo un rato después de salir
document.addEventListener('pointerover',e=>{if(e.pointerType!=='mouse'||(e.target.closest&&e.target.closest('#tt')))return;const t=tipOf(e);if(t){if(Date.now()-(TT._offAt||0)>400)ttShow(t,true);}else if(TT.classList.contains('on'))TT._rearm(2500);});
document.addEventListener('pointerout',e=>{if(e.pointerType!=='mouse'||!TT.classList.contains('on'))return;const to=e.relatedTarget;if(to&&to.closest&&to.closest('#tt'))return;TT._rearm(2500);});
// touch: mantener apretado abre; al soltar queda abierto el tiempo de lectura; tocar fuera lo cierra
document.addEventListener('touchstart',e=>{
  if(e.target.closest&&e.target.closest('#tt'))return;
  const t=tipOf(e);clearTimeout(_ttTimer);
  if(!t){if(TT.classList.contains('on'))ttHide();return;}
  _ttTimer=setTimeout(()=>{ttShow(t,true);_lpFired=Date.now();if(navigator.vibrate)try{navigator.vibrate(15);}catch(_){}},420);
},{passive:true});
['touchend','touchmove','touchcancel'].forEach(ev=>document.addEventListener(ev,e=>{
  clearTimeout(_ttTimer);
  if(ev==='touchend'&&TT.classList.contains('on')&&!(e.target.closest&&e.target.closest('#tt')))TT._rearm(toastMs(TT.innerHTML));
},{passive:true}));
document.addEventListener('click',e=>{if(Date.now()-_lpFired<700){e.stopPropagation();e.preventDefault();}},true);
document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('[data-tip]'))e.preventDefault();});

// altura visible real: se vuelve a medir al volver de otra app, rotar o mostrar/ocultar la barra del navegador
function setAppH(){if(!document.documentElement||!document.documentElement.style)return;const v=window.visualViewport,h=Math.round((v&&v.height)||window.innerHeight);document.documentElement.style.setProperty('--app-h',h+'px');try{if(G.phase==='game'||G.phase==='over')fitBoard();}catch(e){}}
function setAppHSoon(){setAppH();setTimeout(setAppH,120);setTimeout(setAppH,500);}
setAppH();
window.addEventListener('resize',setAppHSoon);window.addEventListener('orientationchange',setAppHSoon);window.addEventListener('pageshow',setAppHSoon);window.addEventListener('focus',setAppHSoon);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)setAppHSoon();});
if(window.visualViewport)window.visualViewport.addEventListener('resize',setAppHSoon);

// Bienvenida: solo la primera vez. Se marca como vista apenas se decide mostrarla (cualquier forma de cerrarla o recargar ya no la repite);
// si el navegador no puede guardar el dato, no se muestra nunca.
function welcomeInit(){
  try{
    const K='spire-welcome-seen';
    if(localStorage.getItem(K)||localStorage.getItem('spire-diff'))return;
    localStorage.setItem(K,'1');if(localStorage.getItem(K)!=='1')return;
    const m=document.getElementById('welcome-modal');if(!m)return;
    document.getElementById('welcome-x').innerHTML=ic('close');
    const close=()=>{m.classList.remove('open');document.removeEventListener('keydown',onKey);};
    const onKey=e=>{if(e.key==='Escape')close();};
    document.getElementById('welcome-x').onclick=close;document.getElementById('welcome-no').onclick=close;
    document.getElementById('welcome-yes').onclick=()=>{close();openTutorial();};
    m.addEventListener('click',e=>{if(e.target===m)close();});
    setTimeout(()=>{const sc=document.getElementById('sel1-screen');if(!sc||!sc.classList.contains('active'))return;ttHide();m.classList.add('open');document.addEventListener('keydown',onKey);},600);
  }catch(e){}
}
welcomeInit();
try{window._muted=localStorage.getItem('spire-mute')==='1';}catch(e){}
</script>
